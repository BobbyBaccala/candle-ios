dding:9px 10px;border-radius:12px;color:#70877b;font-weight:700;font-size:12px}nav button.active{background:#ddf7e8;color:#087f4f}.node{display:flex;gap:15px;align-items:center;padding:14px;border-bottom:1px solid #edf4ef}.circle{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:#ddf7e8;font-size:25px;flex-shrink:0}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}  .filters{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}.filter{white-space:nowrap;background:white;border:1px solid #d7e8de;border-radius:30px;padding:9px 14px;color:#087f4f;font-weight:700}.filter.active,.tile.active{background:#ddf7e8;border-color:#087f4f}.tile{cursor:pointer}.tile:hover,.choice:hover{border-color:#16a66c}.node .btn{padding:10px 14px}.card h2{line-height:1.25} .chart-scroll{overflow-x:auto;margin:12px 0}.chart-table{width:100%;border-collapse:collapse;font-size:13px;text-align:right}.chart-table th,.chart-table td{padding:8px 10px;border-bottom:1px solid #e1eee6}.chart-table th:first-child,.chart-table td:first-child{text-align:left}.chart-table th{color:#087f4f} </style></head><body><header><div class="top"><div><h1>🕯 Candle</h1><div class="sub">Master the markets. One day at a time.</div></div><span class="pill" id="xpTop">0 XP</span></div></header><main id="app"></main><nav id="nav"></nav><script>
const topics=[["Market Foundations",[["Asset classes","Stocks represent ownership; bonds are debt claims; cash is liquid but exposed to inflation.",["Which instrument generally represents ownership?","Stock","Bond","Treasury bill",0],["A bond investor is generally a…","Lender","Company owner","Market maker",0],["Which asset is most directly exposed to inflation erosion if its nominal value stays fixed?","Cash","An inflation-linked bond","A real asset",0]],["Order books","A bid is an offer to buy and an ask is an offer to sell. The quoted spread is ask minus bid.",["Bid $41.15 and ask $41.22: spread?","$0.07","$0.37","$82.37",0],["Which side would a market buy normally execute against?","Ask","Bid","Last close",0],["A narrower quoted spread usually means…","Lower immediate spread cost","Guaranteed liquidity","Zero slippage",0]],["Order types","Market orders prioritize execution; limit orders control acceptable price but can remain unfilled. Stop orders may execute away from the stop price.",["Which order specifies a maximum buy price?","Buy limit","Market buy","Market sell",0],["Can a stop-market order fill worse than its stop price?","Yes","Never","Only on bonds",0],["A market order guarantees…","Neither exact price nor timing","A precise price","A profit",0]],["Liquidity & slippage","Liquidity describes how readily an asset trades without moving price. Large orders and thin markets can create slippage.",["Thin markets are more likely to have…","Wider spreads","Guaranteed fills","Lower impact",0],["Slippage is…","Difference between expected and executed price","Broker commission only","Dividend yield",0],["What can reduce market impact?","Splitting a large order","Always using market orders","Ignoring volume",0]],["Fees & returns","Net return reflects trading fees, spreads, financing, taxes where applicable and slippage.",["Gross gain $65, costs $12. Net gain?","$53","$77","$65",0],["Higher turnover can increase…","Transaction costs","Guaranteed returns","Ownership rights",0],["If net profit is negative, gross profit must be negative.","False","True","Always zero",0]]]],["Chart Literacy",[["OHLC anatomy","Open, high, low and close summarize one trading interval. Candle bodies span open-to-close; wicks show extremes.",["Open 80, close 75: body direction?","Down","Up","Flat",0],["High 90, open 83, close 86: upper wick?","$4","$7","$3",0],["Can OHLC tell the exact intrabar price sequence?","No","Always","Only on daily charts",0]],["Timeframes & noise","A 5-minute candle and a daily candle summarize different periods. Shorter periods can appear noisier.",["Which contains more time?","Daily candle","5-minute candle","1-minute candle",0],["Changing timeframe may change…","Pattern appearance","Past trades","Company ownership",0],["One candle predicts tomorrow's close reliably.","False","True","By definition",0]],["Support & resistance","Support and resistance are areas where buying or selling has previously appeared, not guaranteed barriers.",["Is resistance a guaranteed ceiling?","No","Yes","Only on weekly charts",0],["A breakout may…","Fail and reverse","Guarantee a trend","Eliminate risk",0],["Past price levels are best viewed as…","Context","Certainty","Insider information",0]],["Volume & volatility","Volume counts traded shares or contracts. Volatility measures variability of returns; neither predicts direction alone.",["High volume always means price rises.","False","True","Only for ETFs",0],["Volatility measures…","Return variability","Dividend amount","Share ownership",0],["High volatility usually implies…","Larger potential price swings","Guaranteed loss","No liquidity",0]],["Moving averages","A moving average smooths historical prices. It lags changes and can produce false signals.",["A 20-period SMA uses…","Last 20 observations","Next 20 forecasts","Only the high prices",0],["Moving averages are…","Lagging indicators","Guaranteed predictors","Risk-free signals",0],["A price crossing an average…","Can be a false signal","Guarantees profit","Removes spread",0]]]],["Risk Management",[["Risk per trade","A risk budget limits intended loss. Actual losses can exceed a stop estimate due to gaps, slippage or execution issues.",["Account $8,000, risk 1%. Budget?","$80","$800","$8",0],["A stop order guarantees your maximum loss.","False","True","Only on stocks",0],["A larger stop distance with fixed risk means…","Smaller position","Larger position","Same position",0]],["Position sizing","For a long trade, approximate shares = floor(risk dollars ÷ (entry minus stop)), when stop is below entry.",["Risk $120, entry $40, stop $37. Shares?","40","120","360",0],["Risk $75, entry $25, stop $23.50. Shares?","50","75","112",0],["Doubling stop distance with same budget…","Halves approximate shares","Doubles shares","Has no effect",0]],["Risk/reward","Potential reward and risk can be compared, but payoff ratios alone do not determine expected profitability.",["Entry 50, stop 48, target 56: reward/risk?","3:1","1:3","2:1",0],["A high reward/risk ratio guarantees profit.","False","True","For day trades",0],["Risk $2, reward $4: reward/risk?","2:1","1:2","4:1",0]],["Diversification","Holding imperfectly correlated assets can reduce portfolio-specific risk, but broad market risk remains.",["Diversification eliminates all risk.","False","True","Only for bonds",0],["Two nearly identical stocks offer…","Limited diversification","Perfect diversification","Zero correlation",0],["Diversification most directly reduces…","Idiosyncratic risk","All systematic risk","Inflation",0]],["Drawdowns","A drawdown measures the decline from a prior portfolio peak. Recovering from losses requires a larger percentage gain.",["After a 20% loss, gain needed to recover?","25%","20%","10%",0],["After a 50% loss, recovery requires…","100%","50%","25%",0],["A drawdown is measured from…","Prior peak","Initial deposit only","Last trade price",0]]]],["Fundamentals",[["Revenue, profit & cash","Revenue is sales; net income is accounting profit; cash flow measures cash movement. These can diverge.",["Revenue minus all expenses and taxes is generally…","Net income","Market cap","Volume",0],["Positive net income guarantees positive operating cash flow.","No","Yes","Only quarterly",0],["Revenue measures…","Sales","Profit","Cash on hand",0]],["Balance sheets","Assets = liabilities + equity. Balance sheets describe financial position at a point in time.",["Assets 500, liabilities 300. Equity?","200","800","300",0],["Debt is generally a…","Liability","Revenue","Dividend",0],["Cash is generally an…","Asset","Expense","Liability",0]],["Market capitalization","Market cap equals share price times shares outstanding; it is not the company's cash balance.",["20 million shares × $15 = market cap?","$300 million","$35 million","$3 billion",0],["A stock split alone generally changes market cap?","No","Doubles it","Halves it",0],["Market cap measures…","Equity market value","Annual profit","Cash reserves",0]],["Valuation multiples","P/E compares price to earnings. Multiples depend on growth, risk, accounting and business context.",["Price $60, EPS $3. P/E?","20","180","0.05",0],["A low P/E guarantees undervaluation.","False","True","Only for banks",0],["Negative earnings make a conventional positive P/E…","Not meaningful","Always 1","Guaranteed cheap",0]],["ETFs & index funds","An ETF trades on an exchange and may track an index, sector or strategy. Fees and tracking differences matter.",["An index ETF guarantees the index return exactly.","No","Yes","Only monthly",0],["Expense ratios are…","Ongoing fund costs","Dividends","Bid prices",0],["An ETF can hold…","Many securities","Only one stock","Only cash",0]]]],["Economics & Rates",[["Inflation & purchasing power","Inflation is a sustained rise in the general price level, reducing the purchasing power of a fixed nominal amount.",["Prices rise 5%, income unchanged. Purchasing power…","Falls","Rises","Unchanged",0],["Nominal return 7%, inflation 3%: approximate real return?","4%","10%","21%",0],["Inflation measures…","General price-level change","Every stock price","GDP alone",0]],["Interest rates","Interest rates influence borrowing costs and discount rates. Bond prices typically move inversely to market yields.",["Market yields rise. Existing fixed-rate bond prices usually…","Fall","Rise","Stay fixed",0],["Higher discount rates generally…","Lower present values","Raise present values","Eliminate uncertainty",0],["Rate changes affect all stocks equally.","False","True","By definition",0]],["Compounding","Compounding earns returns on earlier returns. Actual investment returns vary and losses compound too.",["$100 grows 10% then 10%. End value?","$121","$120","$110",0],["+20% followed by −20% yields…","−4%","0%","+4%",0],["Compounding depends on…","Time and returns","Share ticker","Exchange name",0]],["Economic indicators","GDP, unemployment, inflation and policy rates help describe the economy, but market reactions depend on expectations.",["GDP broadly measures…","Value of final production","Stock index level","All household wealth",0],["A positive jobs report guarantees stock gains.","No","Yes","Only during expansions",0],["Markets react partly to…","Surprises versus expectations","Headlines alone","Past certainty",0]],["Central banks","Central banks influence short-term policy rates and financial conditions, but do not directly set every market interest rate.",["A central bank policy rate is…","A benchmark policy tool","Every bank loan rate","A stock dividend",0],["Central banks can directly guarantee stock gains.","No","Yes","During recessions",0],["Monetary policy changes can affect…","Borrowing costs and expectations","Only share counts","Nothing outside bonds",0]]]],["Portfolio Strategy",[["Asset allocation","Asset allocation divides capital across broad asset categories according to goals, horizon and risk tolerance.",["A short time horizon generally supports…","Considering liquidity needs","Guaranteed equity exposure","Ignoring volatility",0],["Rebalancing means…","Restoring target weights","Chasing winners only","Buying one asset",0],["Allocation should reflect…","Goals and constraints","Ticker popularity","Last week's return",0]],["Correlation","Correlation describes how returns move together, from −1 to +1, but can change in stressed markets.",["Correlation +1 means returns move…","Perfectly together in standardized terms","In opposite directions","Independently",0],["Correlation can change over time.","True","False","Only for currencies",0],["Diversification generally benefits from…","Lower correlation","Higher identical exposure","Zero holdings",0]],["Expected value","Expected value is a probability-weighted average of possible payoffs; estimated probabilities can be wrong.",["60% chance +$10, 40% chance −$10. EV?","+$2","+$10","−$2",0],["Positive expected value guarantees any single win.","No","Yes","Only for stocks",0],["30% chance +$20, 70% chance −$5. EV?","+$2.50","+$15","−$3.50",0]],["Behavioral biases","Loss aversion, anchoring, overconfidence and recency bias can impair financial decisions.",["Overweighting recent outcomes is…","Recency bias","Diversification","Duration",0],["Anchoring means relying too heavily on…","An initial reference point","All available data","Expected inflation",0],["A trading journal can help…","Review decisions systematically","Guarantee profit","Remove volatility",0]],["Paper trading & review","Paper trading practices decision-making without risking real capital, but simulated fills and emotions differ from live markets.",["Paper fills always match live fills.","False","True","For large orders",0],["A good journal records…","Rationale, risk and outcome","Only winning trades","Only P&L",0],["Consistent simulated profits guarantee live success.","No","Yes","If tracked daily",0]]]]];
const lessons=topics.flatMap(([unit,items])=>items.map(([title,explain,...qs])=>({unit,title,explain,qs:qs.map(q=>({q:q[0],options:q.slice(1,4),correct:q[4]}))})));
const KEY="candle-browser-v2",OLD="candle-browser-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null");if(!state){let old=JSON.parse(localStorage.getItem(OLD)||"null");state={xp:0,done:[],streak:old?.streak||0,last:old?.last||"",attempts:0,perfect:0,gameWins:0}}}catch{state=null}
state ||= {xp:0,done:[],streak:0,last:"",attempts:0,perfect:0,gameWins:0};
let tab="Home",lesson=null,question=0,selected=null,checked=false,mistakes=0,game="position",gameRound=0,gameFeedback="",unitFilter="All";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function award(id){if(state.done.includes(id))return false;state.done.push(id);state.xp+=mistakes===0?40:25;if(mistakes===0)state.perfect++;const d=today();if(state.last!==d){let prev=new Date();prev.setDate(prev.getDate()-1);state.streak=state.last===prev.toLocaleDateString("en-CA")?state.streak+1:1;state.last=d}save();return true}
function button(t,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function go(t){tab=t;lesson=null;gameFeedback="";render()}
function start(i){lesson=i;question=0;selected=null;checked=false;mistakes=0;render()}
function choose(i){if(checked)return;selected=i;render()}
function check(){if(selected===null)return;checked=true;state.attempts++;if(selected!==lessons[lesson].qs[question].correct)mistakes++;save();render()}
function advance(){if(question<lessons[lesson].qs.length-1){question++;selected=null;checked=false;render()}else{let first=award(lesson);let i=lesson;lesson=null;tab="Learn";app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:58px">🏅</div><h2>Lesson complete!</h2><p>'+esc(lessons[i].title)+'</p><h2>'+(first?(mistakes===0?"+40 XP":"+25 XP"):"Review complete")+'</h2><p class="muted">'+(mistakes===0?"Perfect round!":mistakes+" question(s) missed. Review explanations and try again.")+'</p>'+button("Next lesson","start("+Math.min(i+1,lessons.length-1)+")")+' '+button("Learning path","go(\'Learn\')","secondary")+'</section>';updateHeader()}}
function updateHeader(){document.getElementById("xpTop").textContent=state.xp+" XP";nav.innerHTML=["Home","Learn","Play","Compete","Profile"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+({Home:"⌂",Learn:"📚",Play:"🎮",Compete:"🏆",Profile:"👤"}[t])+'<br>'+t+'</button>').join("")}
function render(){updateHeader();if(lesson!==null)return renderLesson();if(tab==="Home")return renderHome();if(tab==="Learn")return renderLearn();if(tab==="Play")return renderPlay();if(tab==="Compete")return renderCompete();renderProfile()}
function renderHome(){let next=lessons.findIndex((_,i)=>!state.done.includes(i));if(next<0)next=0;app.innerHTML='<div class="stats"><span class="pill">🔥 '+state.streak+' day streak</span><span class="pill">⭐ '+state.xp+' XP</span><span class="pill">✓ '+state.done.length+'/'+lessons.length+' lessons</span></div><section class="card"><div class="eyebrow">Your journey</div><h2>From beginner to market thinker</h2><p class="muted">Six learning tracks, thirty lessons and 540 practice questions. Earn more XP by finishing a lesson without mistakes. These practice forms revisit 90 foundational concepts.</p><div class="bar"><div style="width:'+(state.done.length/lessons.length*100)+'%"></div></div><p>'+Math.round(state.done.length/lessons.length*100)+'% complete</p>'+button("Continue: "+esc(lessons[next].title)+" →","start("+next+")")+'</section><h2>Explore your tracks</h2><div class="grid">'+topics.map(([unit,ls],i)=>{let startIdx=topics.slice(0,i).reduce((n,t)=>n+t[1].length,0),done=ls.filter((_,j)=>state.done.includes(startIdx+j)).length;return '<button class="tile" onclick="unitFilter=\''+unit+'\';go(\'Learn\')"><div style="font-size:28px">'+["🏛️","📊","🛡️","🏢","🌍","🧠"][i]+'</div><strong>'+unit+'</strong><small>'+done+'/'+ls.length+' complete</small><div class="bar" style="margin-top:10px"><div style="width:'+(done/ls.length*100)+'%"></div></div></button>'}).join("")+'</div><section class="card"><h3>🎮 Practice beyond multiple choice</h3><p>Try position sizing, net returns, candle anatomy, expected value and drawdown recovery.</p>'+button("Open arcade","go(\'Play\')","secondary")+'</section>'}
function renderLearn(){let options=["All",...topics.map(t=>t[0])];app.innerHTML='<h2>📚 Learning path</h2><p class="muted">30 lessons · 540 question forms · 6 tracks</p><div class="filters">'+options.map(o=>'<button class="filter '+(unitFilter===o?"active":"")+'" onclick="unitFilter=\''+o+'\';render()">'+o+'</button>').join("")+'</div>'+topics.map(([unit,items],u)=>{if(unitFilter!=="All"&&unitFilter!==unit)return "";let startIdx=topics.slice(0,u).reduce((n,t)=>n+t[1].length,0);return '<h3>'+["🏛️","📊","🛡️","🏢","🌍","🧠"][u]+' '+unit+'</h3>'+items.map(([title],j)=>{let i=startIdx+j;return '<div class="node"><span class="circle">'+(state.done.includes(i)?"✓":(j+1))+'</span><div style="flex:1"><strong>'+esc(title)+'</strong><div class="muted">18 practice questions · '+(state.done.includes(i)?"Completed":"Up to 40 XP")+'</div></div>'+button(state.done.includes(i)?"Review":"Start","start("+i+")","secondary")+'</div>'}).join("")}).join("")}
function renderLesson(){let l=lessons[lesson],q=l.qs[question];app.innerHTML='<div class="eyebrow">'+esc(l.unit)+' · '+(question+1)+' of '+l.qs.length+'</div><div class="bar" style="margin-top:12px"><div style="width:'+((question+1)/l.qs.length*100)+'%"></div></div><section class="card"><h2>'+esc(l.title)+'</h2><p>'+esc(l.explain)+'</p><h3>'+esc(q.q)+'</h3><div class="choices">'+q.options.map((o,i)=>'<button class="choice '+(selected===i?"selected":"")+'" '+(checked?"disabled":"")+' onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+'</div>'+(checked?'<div class="feedback '+(selected===q.correct?"":"bad")+'"><b>'+(selected===q.correct?"✓ Correct!":"✕ Not quite.")+'</b><p>Correct answer: '+esc(q.options[q.correct])+'. '+esc(l.explain)+'</p></div>':'')+(checked?button(question===l.qs.length-1?"Finish lesson":"Next question →","advance()"):button("Check answer","check()"))+' '+button("Exit","go(\'Learn\')","secondary")+'</section><p class="muted">Complete all eighteen questions to earn XP. Incorrect answers reduce your perfect-round bonus.</p>'}
const games=[
{id:"position",name:"Position Sizer",icon:"🛡️",desc:"Manage capital at risk",rounds:[["Account $12,000, risk 1%, entry $48, stop $45. Maximum whole shares?",40,"Risk $120 ÷ $3 per share = 40."],["Account $15,000, risk 2%, entry $75, stop $69. Maximum whole shares?",50,"Risk $300 ÷ $6 = 50."],["Account $9,000, risk 1%, entry $32, stop $29. Maximum whole shares?",30,"Risk $90 ÷ $3 = 30."]]},

function setGame(i){game=games[i].id;gameRound=0;gameFeedback="";render()}
function renderPlay(){let g=games.find(x=>x.id===game)||games[0],r=g.rounds[gameRound];app.innerHTML='<h2>🎮 Trading arcade</h2>'+button('Open interactive chart lab →','renderCharts()','secondary')+'<p class="muted">Six practice modes with three progressively different calculations each. No real money involved.</p><div class="grid">'+games.map((x,i)=>'<button class="tile '+(game===x.id?"active":"")+'" onclick="setGame('+i+')"><div style="font-size:28px">'+x.icon+'</div><strong>'+x.name+'</strong><small>'+x.desc+'</small></button>').join("")+'</div><section class="card"><div class="eyebrow">'+g.name+' · Round '+(gameRound+1)+'/3</div><h2>'+esc(r[0])+'</h2><input id="answer" type="number" step="any" placeholder="Enter a number" aria-label="Your answer" style="width:100%;padding:15px;border:2px solid #d7e8de;border-radius:12px;font:inherit;margin:12px 0">'+(gameFeedback?'<div class="feedback '+(gameFeedback==="correct"?"":"bad")+'"><b>'+(gameFeedback==="correct"?"Correct!":"Not quite.")+'</b><p>'+esc(r[2])+'</p></div>':'')+button("Check answer","checkGame()")+' '+button("Next round →","nextGame()","secondary")+'</section><p class="muted">Practice XP is intentionally not awarded yet to prevent unlimited XP farming. Losses can exceed estimates when orders slip or markets gap.</p>'}
function checkGame(){let g=games.find(x=>x.id===game),r=g.rounds[gameRound],el=document.getElementById("answer");if(el.value.trim()==="")return;gameFeedback=Math.abs(Number(el.value)-r[1])<0.0001?"correct":"wrong";if(gameFeedback==="correct"){state.gameWins++;save()}renderPlay()}

/* Expanded question practice: 90 original questions x six independently selectable
   forms = 540 practice prompts. Forms assess the same 90 core learning objectives. */
const questionForms=[
(q)=>({...q,kind:"standard"}),
(q)=>({q:"Review challenge: "+q.q,options:[q.options[1],q.options[2],q.options[0]],correct:(q.correct+2)%3,kind:"review"}),
(q)=>({q:"Knowledge check — "+q.q,options:[q.options[2],q.options[0],q.options[1]],correct:(q.correct+1)%3,kind:"review"}),
(q)=>({q:"Select the accurate answer: "+q.q,options:[q.options[0],q.options[2],q.options[1]],correct:q.correct===0?0:q.correct===1?2:1,kind:"review"}),
(q)=>({q:"Final mastery check — "+q.q,options:[q.options[1],q.options[0],q.options[2]],correct:q.correct===0?1:q.correct===1?0:2,kind:"mastery"}),
(q)=>({q:"Retention check — "+q.q,options:[q.options[2],q.options[1],q.options[0]],correct:2-q.correct,kind:"retention"})
];
for(const l of lessons){const original=l.qs.slice();l.qs=questionForms.flatMap((make,form)=>original.map((q,index)=>({...make(q),form,originalIndex:index})))}
const charts=[
{id:"ohlc",title:"Candlestick Anatomy",unit:"Price action",hint:"Each candle displays its open, high, low and close. Read the labelled values; do not assume future direction.",series:[{o:100,h:108,l:97,c:105},{o:105,h:110,l:102,c:103},{o:103,h:112,l:101,c:109},{o:109,h:114,l:106,c:107},{o:107,h:115,l:105,c:113}],tasks:[["What is the final candle's upper wick length?",2,"High 115 minus top of body 113 = 2."],["What is the third candle's body length?",6,"|109 − 103| = 6."],["How many candles closed above their open?",3,"Candles 1, 3 and 5 close above their opens."]]},
{id:"trend",title:"Trend & Pullback",unit:"Trend reading",hint:"Higher highs and higher lows suggest an upward sequence, but do not guarantee continuation.",series:[{o:40,h:44,l:39,c:43},{o:43,h:46,l:42,c:45},{o:45,h:45,l:41,c:42},{o:42,h:48,l:42,c:47},{o:47,h:50,l:45,c:49}],tasks:[["What is the highest high across all five candles?",50,"The final candle reaches 50."],["What is the lowest low across all five candles?",39,"The first candle has a low of 39."],["How much did the close change from first to last candle?",6,"Last close 49 minus first close 43 = +6."]]},
{id:"range",title:"Trading Range",unit:"Range and breakout",hint:"A horizontal price band is descriptive, not a guaranteed support or resistance barrier.",series:[{o:60,h:64,l:58,c:62},{o:62,h:65,l:60,c:61},{o:61,h:64,l:59,c:63},{o:63,h:65,l:61,c:62},{o:62,h:69,l:61,c:68}],tasks:[["How many candles reached a high of at least 65?",3,"Candles 2, 4 and 5 reached 65 or more."],["What is the last candle's closing price?",68,"The final candle closes at 68."],["What is the range (high minus low) of the final candle?",8,"69 − 61 = 8."]]},
{id:"volume",title:"Volume & Price",unit:"Volume interpretation",hint:"Volume is the number of units traded during each interval; it does not reveal future direction.",series:[{o:70,h:74,l:69,c:73,v:120},{o:73,h:75,l:71,c:72,v:95},{o:72,h:76,l:71,c:75,v:180},{o:75,h:77,l:72,c:73,v:140},{o:73,h:80,l:72,c:79,v:310}],tasks:[["Which candle number has the greatest volume?",5,"Candle 5 has 310 units of volume."],["What is the third candle's volume?",180,"The third bar is labelled 180."],["How many candles closed below their open?",2,"Candles 2 and 4 closed below their open."]]},

];
let activeChart=0,chartTask=0,chartFeedback="",chartAnswer="";
function chartSVG(series){const W=640,H=286,padL=52,padR=14,top=18,bottom=34,lo=Math.min(...series.map(x=>x.l))-2,hi=Math.max(...series.map(x=>x.h))+2,scale=v=>top+(hi-v)/(hi-lo)*(H-top-bottom),step=(W-padL-padR)/series.length;
let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Illustrative candlestick chart, with open, high, low and close values listed below" style="width:100%;height:auto;background:#f7fbf8;border-radius:16px">';
for(let i=0;i<=4;i++){let price=lo+(hi-lo)*i/4,y=scale(price);s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#d9e8df" stroke-dasharray="4 4"/><text x="5" y="'+(y+4)+'" fill="#587467" font-size="12">'+price.toFixed(1)+'</text>'}
series.forEach((p,i)=>{let x=padL+step*(i+.5),color=p.c>=p.o?"#087f4f":"#df5b65",yt=scale(Math.max(p.o,p.c)),yb=scale(Math.min(p.o,p.c)),w=Math.min(40,step*.52);s+='<line x1="'+x+'" y1="'+scale(p.h)+'" x2="'+x+'" y2="'+scale(p.l)+'" stroke="'+color+'" stroke-width="4"/><rect x="'+(x-w/2)+'" y="'+yt+'" width="'+w+'" height="'+Math.max(2,yb-yt)+'" rx="3" fill="'+color+'"/><text x="'+x+'" y="'+(H-12)+'" text-anchor="middle" fill="#587467" font-size="14">'+(i+1)+'</text>'});
return s+'</svg>'}
function renderCharts(){const g=charts[activeChart],task=g.tasks[chartTask];app.innerHTML='<h2>📈 Interactive Chart Lab</h2><p class="muted">Six visual case studies · 18 data-grounded challenges. All prices and volumes are illustrative, not live market data.</p><div class="filters">'+charts.map((x,i)=>'<button class="filter '+(activeChart===i?"active":"")+'" onclick="selectChart('+i+')">'+x.title+'</button>').join("")+'</div><section class="card"><div class="eyebrow">'+g.unit+' · Question '+(chartTask+1)+'/3</div><h2>'+g.title+'</h2><p>'+g.hint+'</p>'+chartSVG(g.series)+'<div class="chart-scroll"><table class="chart-table"><thead><tr><th>#</th><th>Open</th><th>High</th><th>Low</th><th>Close</th>'+(g.series.some(p=>p.v!==undefined)?"<th>Volume</th>":"")+'</tr></thead><tbody>'+g.series.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.o+'</td><td>'+p.h+'</td><td>'+p.l+'</td><td>'+p.c+'</td>'+(p.v!==undefined?'<td>'+p.v+'</td>':"")+'</tr>').join("")+'</tbody></table></div><h3>'+task[0]+'</h3><input id="chartAnswer" type="number" step="any" value="'+esc(chartAnswer)+'" placeholder="Enter your numeric answer" aria-label="Chart answer" style="width:100%;padding:14px;border:2px solid #d7e8de;border-radius:12px;font:inherit;margin:8px 0 14px">'+(chartFeedback?'<div class="feedback '+(chartFeedback==="correct"?"":"bad")+'"><b>'+(chartFeedback==="correct"?"Correct":"Try again")+'</b><p>'+task[2]+'</p></div>':"")+button("Check chart","checkChart()")+' '+button("Next chart question →","nextChart()","secondary")+'</section>'}
function selectChart(i){activeChart=i;chartTask=0;chartFeedback="";chartAnswer="";renderCharts()}
function checkChart(){const el=document.getElementById("chartAnswer");if(el.value.trim()==="")return;chartAnswer=el.value;chartFeedback=Math.abs(Number(chartAnswer)-charts[activeChart].tasks[chartTask][1])<.00001?"correct":"wrong";renderCharts()}
function nextChart(){chartTask=(chartTask+1)%3;chartFeedback="";chartAnswer="";renderCharts()}
