<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f4f"><title>Candle · Learn the markets</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17352b;background:#f8fcf9}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{background:#087f4f;color:white;padding:22px 20px;border-radius:0 0 28px 28px}header .top{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}h1{margin:0;font-size:29px}main{max-width:760px;margin:22px auto 105px;padding:0 16px}.sub{opacity:.82}.card{background:white;border:1px solid #e1eee6;border-radius:23px;padding:23px;margin:14px 0;box-shadow:0 8px 22px #087f4f0a}.eyebrow{color:#087f4f;font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.btn{background:#087f4f;color:white;border:0;border-radius:16px;padding:14px 22px;font-weight:800;box-shadow:0 4px #064e3b}.btn:active{transform:translateY(3px);box-shadow:0 1px #064e3b}.btn.secondary{background:#ddf7e8;color:#064e3b;box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}.choices{display:grid;gap:11px;margin:20px 0}.choice{border:2px solid #d7e8de;background:white;padding:15px;text-align:left;border-radius:14px;color:#17352b}.choice.selected{border-color:#087f4f;background:#ddf7e8}.pill{background:#ddf7e8;border-radius:100px;padding:7px 12px;color:#064e3b;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.bar{background:#e1eee6;height:12px;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:#16c784;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{background:white;border:1px solid #e1eee6;border-radius:20px;padding:18px;text-align:left}.tile strong{display:block;margin:8px 0}.muted{color:#70877b}.feedback{background:#ddf7e8;padding:16px;border-radius:16px;margin:15px 0}.feedback.bad{background:#fff0f1}nav{position:fixed;bottom:0;background:white;border-top:1px solid #d7e8de;width:100%;display:flex;justify-content:center;padding:9px 3px max(12px,env(safe-area-inset-bottom));gap:4px}nav button{border:0;background:none;padding:9px 10px;border-radius:12px;color:#70877b;font-weight:700;font-size:12px}nav button.active{background:#ddf7e8;color:#087f4f}.node{display:flex;gap:15px;align-items:center;padding:14px;border-bottom:1px solid #edf4ef}.circle{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:#ddf7e8;font-size:25px;flex-shrink:0}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}  .filters{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}.filter{white-space:nowrap;background:white;border:1px solid #d7e8de;border-radius:30px;padding:9px 14px;color:#087f4f;font-weight:700}.filter.active,.tile.active{background:#ddf7e8;border-color:#087f4f}.tile{cursor:pointer}.tile:hover,.choice:hover{border-color:#16a66c}.node .btn{padding:10px 14px}.card h2{line-height:1.25} </style></head><body><header><div class="top"><div><h1>🕯 Candle</h1><div class="sub">Master the markets. One day at a time.</div></div><span class="pill" id="xpTop">0 XP</span></div></header><main id="app"></main><nav id="nav"></nav><script>
const topics=[["Market Foundations",[["Asset classes","Stocks represent ownership; bonds are debt claims; cash is liquid but exposed to inflation.",["Which instrument generally represents ownership?","Stock","Bond","Treasury bill",0],["A bond investor is generally a…","Lender","Company owner","Market maker",0],["Which asset is most directly exposed to inflation erosion if its nominal value stays fixed?","Cash","An inflation-linked bond","A real asset",0]],["Order books","A bid is an offer to buy and an ask is an offer to sell. The quoted spread is ask minus bid.",["Bid $41.15 and ask $41.22: spread?","$0.07","$0.37","$82.37",0],["Which side would a market buy normally execute against?","Ask","Bid","Last close",0],["A narrower quoted spread usually means…","Lower immediate spread cost","Guaranteed liquidity","Zero slippage",0]],["Order types","Market orders prioritize execution; limit orders control acceptable price but can remain unfilled. Stop orders may execute away from the stop price.",["Which order specifies a maximum buy price?","Buy limit","Market buy","Market sell",0],["Can a stop-market order fill worse than its stop price?","Yes","Never","Only on bonds",0],["A market order guarantees…","Neither exact price nor timing","A precise price","A profit",0]],["Liquidity & slippage","Liquidity describes how readily an asset trades without moving price. Large orders and thin markets can create slippage.",["Thin markets are more likely to have…","Wider spreads","Guaranteed fills","Lower impact",0],["Slippage is…","Difference between expected and executed price","Broker commission only","Dividend yield",0],["What can reduce market impact?","Splitting a large order","Always using market orders","Ignoring volume",0]],["Fees & returns","Net return reflects trading fees, spreads, financing, taxes where applicable and slippage.",["Gross gain $65, costs $12. Net gain?","$53","$77","$65",0],["Higher turnover can increase…","Transaction costs","Guaranteed returns","Ownership rights",0],["If net profit is negative, gross profit must be negative.","False","True","Always zero",0]]]],["Chart Literacy",[["OHLC anatomy","Open, high, low and close summarize one trading interval. Candle bodies span open-to-close; wicks show extremes.",["Open 80, close 75: body direction?","Down","Up","Flat",0],["High 90, open 83, close 86: upper wick?","$4","$7","$3",0],["Can OHLC tell the exact intrabar price sequence?","No","Always","Only on daily charts",0]],["Timeframes & noise","A 5-minute candle and a daily candle summarize different periods. Shorter periods can appear noisier.",["Which contains more time?","Daily candle","5-minute candle","1-minute candle",0],["Changing timeframe may change…","Pattern appearance","Past trades","Company ownership",0],["One candle predicts tomorrow's close reliably.","False","True","By definition",0]],["Support & resistance","Support and resistance are areas where buying or selling has previously appeared, not guaranteed barriers.",["Is resistance a guaranteed ceiling?","No","Yes","Only on weekly charts",0],["A breakout may…","Fail and reverse","Guarantee a trend","Eliminate risk",0],["Past price levels are best viewed as…","Context","Certainty","Insider information",0]],["Volume & volatility","Volume counts traded shares or contracts. Volatility measures variability of returns; neither predicts direction alone.",["High volume always means price rises.","False","True","Only for ETFs",0],["Volatility measures…","Return variability","Dividend amount","Share ownership",0],["High volatility usually implies…","Larger potential price swings","Guaranteed loss","No liquidity",0]],["Moving averages","A moving average smooths historical prices. It lags changes and can produce false signals.",["A 20-period SMA uses…","Last 20 observations","Next 20 forecasts","Only the high prices",0],["Moving averages are…","Lagging indicators","Guaranteed predictors","Risk-free signals",0],["A price crossing an average…","Can be a false signal","Guarantees profit","Removes spread",0]]]],["Risk Management",[["Risk per trade","A risk budget limits intended loss. Actual losses can exceed a stop estimate due to gaps, slippage or execution issues.",["Account $8,000, risk 1%. Budget?","$80","$800","$8",0],["A stop order guarantees your maximum loss.","False","True","Only on stocks",0],["A larger stop distance with fixed risk means…","Smaller position","Larger position","Same position",0]],["Position sizing","For a long trade, approximate shares = floor(risk dollars ÷ (entry minus stop)), when stop is below entry.",["Risk $120, entry $40, stop $37. Shares?","40","120","360",0],["Risk $75, entry $25, stop $23.50. Shares?","50","75","112",0],["Doubling stop distance with same budget…","Halves approximate shares","Doubles shares","Has no effect",0]],["Risk/reward","Potential reward and risk can be compared, but payoff ratios alone do not determine expected profitability.",["Entry 50, stop 48, target 56: reward/risk?","3:1","1:3","2:1",0],["A high reward/risk ratio guarantees profit.","False","True","For day trades",0],["Risk $2, reward $4: reward/risk?","2:1","1:2","4:1",0]],["Diversification","Holding imperfectly correlated assets can reduce portfolio-specific risk, but broad market risk remains.",["Diversification eliminates all risk.","False","True","Only for bonds",0],["Two nearly identical stocks offer…","Limited diversification","Perfect diversification","Zero correlation",0],["Diversification most directly reduces…","Idiosyncratic risk","All systematic risk","Inflation",0]],["Drawdowns","A drawdown measures the decline from a prior portfolio peak. Recovering from losses requires a larger percentage gain.",["After a 20% loss, gain needed to recover?","25%","20%","10%",0],["After a 50% loss, recovery requires…","100%","50%","25%",0],["A drawdown is measured from…","Prior peak","Initial deposit only","Last trade price",0]]]],["Fundamentals",[["Revenue, profit & cash","Revenue is sales; net income is accounting profit; cash flow measures cash movement. These can diverge.",["Revenue minus all expenses and taxes is generally…","Net income","Market cap","Volume",0],["Positive net income guarantees positive operating cash flow.","No","Yes","Only quarterly",0],["Revenue measures…","Sales","Profit","Cash on hand",0]],["Balance sheets","Assets = liabilities + equity. Balance sheets describe financial position at a point in time.",["Assets 500, liabilities 300. Equity?","200","800","300",0],["Debt is generally a…","Liability","Revenue","Dividend",0],["Cash is generally an…","Asset","Expense","Liability",0]],["Market capitalization","Market cap equals share price times shares outstanding; it is not the company's cash balance.",["20 million shares × $15 = market cap?","$300 million","$35 million","$3 billion",0],["A stock split alone generally changes market cap?","No","Doubles it","Halves it",0],["Market cap measures…","Equity market value","Annual profit","Cash reserves",0]],["Valuation multiples","P/E compares price to earnings. Multiples depend on growth, risk, accounting and business context.",["Price $60, EPS $3. P/E?","20","180","0.05",0],["A low P/E guarantees undervaluation.","False","True","Only for banks",0],["Negative earnings make a conventional positive P/E…","Not meaningful","Always 1","Guaranteed cheap",0]],["ETFs & index funds","An ETF trades on an exchange and may track an index, sector or strategy. Fees and tracking differences matter.",["An index ETF guarantees the index return exactly.","No","Yes","Only monthly",0],["Expense ratios are…","Ongoing fund costs","Dividends","Bid prices",0],["An ETF can hold…","Many securities","Only one stock","Only cash",0]]]],["Economics & Rates",[["Inflation & purchasing power","Inflation is a sustained rise in the general price level, reducing the purchasing power of a fixed nominal amount.",["Prices rise 5%, income unchanged. Purchasing power…","Falls","Rises","Unchanged",0],["Nominal return 7%, inflation 3%: approximate real return?","4%","10%","21%",0],["Inflation measures…","General price-level change","Every stock price","GDP alone",0]],["Interest rates","Interest rates influence borrowing costs and discount rates. Bond prices typically move inversely to market yields.",["Market yields rise. Existing fixed-rate bond prices usually…","Fall","Rise","Stay fixed",0],["Higher discount rates generally…","Lower present values","Raise present values","Eliminate uncertainty",0],["Rate changes affect all stocks equally.","False","True","By definition",0]],["Compounding","Compounding earns returns on earlier returns. Actual investment returns vary and losses compound too.",["$100 grows 10% then 10%. End value?","$121","$120","$110",0],["+20% followed by −20% yields…","−4%","0%","+4%",0],["Compounding depends on…","Time and returns","Share ticker","Exchange name",0]],["Economic indicators","GDP, unemployment, inflation and policy rates help describe the economy, but market reactions depend on expectations.",["GDP broadly measures…","Value of final production","Stock index level","All household wealth",0],["A positive jobs report guarantees stock gains.","No","Yes","Only during expansions",0],["Markets react partly to…","Surprises versus expectations","Headlines alone","Past certainty",0]]]],["Portfolio Strategy",[["Asset allocation","Asset allocation divides capital across broad asset categories according to goals, horizon and risk tolerance.",["A short time horizon generally supports…","Considering liquidity needs","Guaranteed equity exposure","Ignoring volatility",0],["Rebalancing means…","Restoring target weights","Chasing winners only","Buying one asset",0],["Allocation should reflect…","Goals and constraints","Ticker popularity","Last week's return",0]],["Correlation","Correlation describes how returns move together, from −1 to +1, but can change in stressed markets.",["Correlation +1 means returns move…","Perfectly together in standardized terms","In opposite directions","Independently",0],["Correlation can change over time.","True","False","Only for currencies",0],["Diversification generally benefits from…","Lower correlation","Higher identical exposure","Zero holdings",0]],["Expected value","Expected value is a probability-weighted average of possible payoffs; estimated probabilities can be wrong.",["60% chance +$10, 40% chance −$10. EV?","+$2","+$10","−$2",0],["Positive expected value guarantees any single win.","No","Yes","Only for stocks",0],["30% chance +$20, 70% chance −$5. EV?","+$2.50","+$15","−$3.50",0]],["Behavioral biases","Loss aversion, anchoring, overconfidence and recency bias can impair financial decisions.",["Overweighting recent outcomes is…","Recency bias","Diversification","Duration",0],["Anchoring means relying too heavily on…","An initial reference point","All available data","Expected inflation",0],["A trading journal can help…","Review decisions systematically","Guarantee profit","Remove volatility",0]],["Paper trading & review","Paper trading practices decision-making without risking real capital, but simulated fills and emotions differ from live markets.",["Paper fills always match live fills.","False","True","For large orders",0],["A good journal records…","Rationale, risk and outcome","Only winning trades","Only P&L",0],["Consistent simulated profits guarantee live success.","No","Yes","If tracked daily",0]]]]];
const lessons=topics.flatMap(([unit,items])=>items.map(([title,explain,...qs])=>({unit,title,explain,qs:qs.map(q=>({q:q[0],options:q.slice(1,4),correct:q[4]}))})));
const KEY="candle-browser-v2",OLD="candle-browser-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null");if(!state){let old=JSON.parse(localStorage.getItem(OLD)||"null");state={xp:0,done:[],streak:old?.streak||0,last:old?.last||"",attempts:0,perfect:0,gameWins:0}}}catch{state=null}
state ||= {xp:0,done:[],streak:0,last:"",attempts:0,perfect:0,gameWins:0};
let tab="Home",lesson=null,question=0,selected=null,checked=false,mistakes=0,game="position",gameRound=0,gameFeedback="",unitFilter="All";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function award(id){if(state.done.includes(id))return false;state.done.push(id);state.xp+=mistakes===0?40:25;if(mistakes===0)state.perfect++;const d=today();if(state.last!==d){let prev=new Date();prev.setDate(prev.getDate()-1);state.streak=state.last===prev.toLocaleDateString("en-CA")?state.streak+1:1;state.last=d}save();return true}
function button(t,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function go(t){tab=t;lesson=null;gameFeedback="";render()}
function start(i){lesson=i;question=0;selected=null;checked=false;mistakes=0;render()}
function choose(i){if(checked)return;selected=i;render()}
function check(){if(selected===null)return;checked=true;state.attempts++;if(selected!==lessons[lesson].qs[question].correct)mistakes++;save();render()}
function advance(){if(question<lessons[lesson].qs.length-1){question++;selected=null;checked=false;render()}else{let first=award(lesson);let i=lesson;lesson=null;tab="Learn";app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:58px">🏅</div><h2>Lesson complete!</h2><p>'+esc(lessons[i].title)+'</p><h2>'+(first?(mistakes===0?"+40 XP":"+25 XP"):"Review complete")+'</h2><p class="muted">'+(mistakes===0?"Perfect round!":mistakes+" question(s) missed. Review explanations and try again.")+'</p>'+button("Next lesson","start("+Math.min(i+1,lessons.length-1)+")")+' '+button("Learning path","go(\'Learn\')","secondary")+'</section>';updateHeader()}}
function updateHeader(){document.getElementById("xpTop").textContent=state.xp+" XP";nav.innerHTML=["Home","Learn","Play","Compete","Profile"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+({Home:"⌂",Learn:"📚",Play:"🎮",Compete:"🏆",Profile:"👤"}[t])+'<br>'+t+'</button>').join("")}
function render(){updateHeader();if(lesson!==null)return renderLesson();if(tab==="Home")return renderHome();if(tab==="Learn")return renderLearn();if(tab==="Play")return renderPlay();if(tab==="Compete")return renderCompete();renderProfile()}
function renderHome(){let next=lessons.findIndex((_,i)=>!state.done.includes(i));if(next<0)next=0;app.innerHTML='<div class="stats"><span class="pill">🔥 '+state.streak+' day streak</span><span class="pill">⭐ '+state.xp+' XP</span><span class="pill">✓ '+state.done.length+'/'+lessons.length+' lessons</span></div><section class="card"><div class="eyebrow">Your journey</div><h2>From beginner to market thinker</h2><p class="muted">Six learning tracks, thirty lessons and ninety knowledge checks. Earn more XP by finishing a lesson without mistakes.</p><div class="bar"><div style="width:'+(state.done.length/lessons.length*100)+'%"></div></div><p>'+Math.round(state.done.length/lessons.length*100)+'% complete</p>'+button("Continue: "+esc(lessons[next].title)+" →","start("+next+")")+'</section><h2>Explore your tracks</h2><div class="grid">'+topics.map(([unit,ls],i)=>{let startIdx=topics.slice(0,i).reduce((n,t)=>n+t[1].length,0),done=ls.filter((_,j)=>state.done.includes(startIdx+j)).length;return '<button class="tile" onclick="unitFilter=\''+unit+'\';go(\'Learn\')"><div style="font-size:28px">'+["🏛️","📊","🛡️","🏢","🌍","🧠"][i]+'</div><strong>'+unit+'</strong><small>'+done+'/'+ls.length+' complete</small><div class="bar" style="margin-top:10px"><div style="width:'+(done/ls.length*100)+'%"></div></div></button>'}).join("")+'</div><section class="card"><h3>🎮 Practice beyond multiple choice</h3><p>Try position sizing, net returns, candle anatomy, expected value and drawdown recovery.</p>'+button("Open arcade","go(\'Play\')","secondary")+'</section>'}
function renderLearn(){let options=["All",...topics.map(t=>t[0])];app.innerHTML='<h2>📚 Learning path</h2><p class="muted">30 lessons · 90 questions · 6 tracks</p><div class="filters">'+options.map(o=>'<button class="filter '+(unitFilter===o?"active":"")+'" onclick="unitFilter=\''+o+'\';render()">'+o+'</button>').join("")+'</div>'+topics.map(([unit,items],u)=>{if(unitFilter!=="All"&&unitFilter!==unit)return "";let startIdx=topics.slice(0,u).reduce((n,t)=>n+t[1].length,0);return '<h3>'+["🏛️","📊","🛡️","🏢","🌍","🧠"][u]+' '+unit+'</h3>'+items.map(([title],j)=>{let i=startIdx+j;return '<div class="node"><span class="circle">'+(state.done.includes(i)?"✓":(j+1))+'</span><div style="flex:1"><strong>'+esc(title)+'</strong><div class="muted">3 challenges · '+(state.done.includes(i)?"Completed":"Up to 40 XP")+'</div></div>'+button(state.done.includes(i)?"Review":"Start","start("+i+")","secondary")+'</div>'}).join("")}).join("")}
function renderLesson(){let l=lessons[lesson],q=l.qs[question];app.innerHTML='<div class="eyebrow">'+esc(l.unit)+' · '+(question+1)+' of '+l.qs.length+'</div><div class="bar" style="margin-top:12px"><div style="width:'+((question+1)/l.qs.length*100)+'%"></div></div><section class="card"><h2>'+esc(l.title)+'</h2><p>'+esc(l.explain)+'</p><h3>'+esc(q.q)+'</h3><div class="choices">'+q.options.map((o,i)=>'<button class="choice '+(selected===i?"selected":"")+'" '+(checked?"disabled":"")+' onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+'</div>'+(checked?'<div class="feedback '+(selected===q.correct?"":"bad")+'"><b>'+(selected===q.correct?"✓ Correct!":"✕ Not quite.")+'</b><p>Correct answer: '+esc(q.options[q.correct])+'. '+esc(l.explain)+'</p></div>':'')+(checked?button(question===l.qs.length-1?"Finish lesson":"Next question →","advance()"):button("Check answer","check()"))+' '+button("Exit","go(\'Learn\')","secondary")+'</section><p class="muted">Complete all three questions to earn XP. Incorrect answers reduce your perfect-round bonus.</p>'}
const games=[
{id:"position",name:"Position Sizer",icon:"🛡️",desc:"Manage capital at risk",rounds:[["Account $12,000, risk 1%, entry $48, stop $45. Maximum whole shares?",40,"Risk $120 ÷ $3 per share = 40."],["Account $15,000, risk 2%, entry $75, stop $69. Maximum whole shares?",50,"Risk $300 ÷ $6 = 50."],["Account $9,000, risk 1%, entry $32, stop $29. Maximum whole shares?",30,"Risk $90 ÷ $3 = 30."]]},
{id:"returns",name:"Net P&L",icon:"💰",desc:"Include transaction costs",rounds:[["Buy 20 shares at $18, sell at $22. Total fees $6. Net profit ($)?",74,"20 × ($22 − $18) − $6 = $74."],["Buy 12 shares at $50, sell at $47. Total fees $4. Net P&L ($)?",-40,"12 × ($47 − $50) − $4 = −$40."],["Buy 15 shares at $30, sell at $32. Total fees $9. Net profit ($)?",21,"15 × $2 − $9 = $21."]]},
{id:"candles",name:"Candle Decoder",icon:"🕯️",desc:"Read OHLC structures",rounds:[["Open $101, high $108, low $99, close $105. Upper wick length ($)?",3,"$108 − max($101, $105) = $3."],["Open $64, high $66, low $57, close $60. Lower wick length ($)?",3,"min($64, $60) − $57 = $3."],["Open $42, high $47, low $40, close $46. Body size ($)?",4,"|$46 − $42| = $4."]]},
{id:"expectation",name:"Expected Value",icon:"🎲",desc:"Probability-weighted payoffs",rounds:[["40% chance +$30, 60% chance −$10. Expected value ($)?",6,"0.4 × $30 + 0.6 × (−$10) = $6."],["25% chance +$60, 75% chance −$20. Expected value ($)?",0,"0.25 × $60 + 0.75 × (−$20) = $0."],["70% chance +$15, 30% chance −$25. Expected value ($)?",3,"0.7 × $15 + 0.3 × (−$25) = $3."]]},
{id:"drawdown",name:"Drawdown Lab",icon:"📉",desc:"Understand recovery math",rounds:[["Portfolio falls from $100 to $80. Percentage gain needed to recover? (enter %) ",25,"($100 ÷ $80 − 1) × 100 = 25%."],["Portfolio falls from $100 to $50. Recovery gain (%)?",100,"($100 ÷ $50 − 1) × 100 = 100%."],["Portfolio falls from $200 to $160. Recovery gain (%)?",25,"($200 ÷ $160 − 1) × 100 = 25%."]]},
{id:"allocation",name:"Allocation Math",icon:"⚖️",desc:"Portfolio weights and rebalancing",rounds:[["Portfolio $10,000. Target 60% equities. Dollar allocation to equities?",6000,"$10,000 × 0.60 = $6,000."],["Portfolio $20,000. Target 25% bonds. Dollar allocation to bonds?",5000,"$20,000 × 0.25 = $5,000."],["Portfolio $8,000. Stocks currently $5,600. Current stock weight (%)?",70,"$5,600 ÷ $8,000 × 100 = 70%."]]}
];
function setGame(i){game=games[i].id;gameRound=0;gameFeedback="";render()}
function renderPlay(){let g=games.find(x=>x.id===game)||games[0],r=g.rounds[gameRound];app.innerHTML='<h2>🎮 Trading arcade</h2><p class="muted">Six practice modes with three progressively different calculations each. No real money involved.</p><div class="grid">'+games.map((x,i)=>'<button class="tile '+(game===x.id?"active":"")+'" onclick="setGame('+i+')"><div style="font-size:28px">'+x.icon+'</div><strong>'+x.name+'</strong><small>'+x.desc+'</small></button>').join("")+'</div><section class="card"><div class="eyebrow">'+g.name+' · Round '+(gameRound+1)+'/3</div><h2>'+esc(r[0])+'</h2><input id="answer" type="number" step="any" placeholder="Enter a number" aria-label="Your answer" style="width:100%;padding:15px;border:2px solid #d7e8de;border-radius:12px;font:inherit;margin:12px 0">'+(gameFeedback?'<div class="feedback '+(gameFeedback==="correct"?"":"bad")+'"><b>'+(gameFeedback==="correct"?"Correct!":"Not quite.")+'</b><p>'+esc(r[2])+'</p></div>':'')+button("Check answer","checkGame()")+' '+button("Next round →","nextGame()","secondary")+'</section><p class="muted">Practice XP is intentionally not awarded yet to prevent unlimited XP farming. Losses can exceed estimates when orders slip or markets gap.</p>'}
function checkGame(){let g=games.find(x=>x.id===game),r=g.rounds[gameRound],el=document.getElementById("answer");if(el.value.trim()==="")return;gameFeedback=Math.abs(Number(el.value)-r[1])<0.0001?"correct":"wrong";if(gameFeedback==="correct"){state.gameWins++;save()}renderPlay()}
function nextGame(){gameRound=(gameRound+1)%3;gameFeedback="";renderPlay()}
function renderCompete(){app.innerHTML='<section class="card"><h2>🏆 Achievements</h2><p>Earn these by learning, not by simulated investment returns.</p>'+[[1,"First Spark","Complete your first lesson"],[5,"Getting Started","Complete five lessons"],[15,"Market Explorer","Complete fifteen lessons"],[30,"Curriculum Champion","Complete all thirty lessons"]].map(([n,name,desc])=>'<div class="node"><span class="circle">'+(state.done.length>=n?"🏅":"🔒")+'</span><div><strong>'+name+'</strong><div class="muted">'+desc+'</div></div></div>').join("")+'</section><section class="card"><h3>Leagues are coming later</h3><p class="muted">No fake global leaderboard or fabricated rankings. Multiplayer requires accounts and a backend.</p></section>'}
