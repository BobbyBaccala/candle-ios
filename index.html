const KEY="candle-browser-v2",OLD="candle-browser-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null");if(!state){let old=JSON.parse(localStorage.getItem(OLD)||"null");state={xp:0,done:[],streak:old?.streak||0,last:old?.last||"",attempts:0,perfect:0,gameWins:0}}}catch{state=null}
state ||= {xp:0,done:[],streak:0,last:"",attempts:0,perfect:0,gameWins:0};
let tab="Home",lesson=null,question=0,selected=null,checked=false,mistakes=0,game="position",gameRound=0,gameFeedback="",unitFilter="All";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function award(id){if(state.done.includes(id))return false;state.done.push(id);state.xp+=mistakes===0?40:25;if(mistakes===0)state.perfect++;const d=today();if(state.last!==d){let prev=new Date();prev.setDate(prev.getDate()-1);state.streak=state.last===prev.toLocaleDateString("en-CA")?state.streak+1:1;state.last=d}save();return true}
function button(t,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function go(t){tab=t;lesson=null;gameFeedback="";render()}
function start(i){lesson=i;question=0;selected=null;checked=false;mistakes=0;render()}
function choose(i){if(checked)return;selected=i;render()}
function check(){if(selected===null)return;checked=true;state.attempts++;if(selected!==lessons[lesson].qs[question].correct)mistakes++;save();render()}
function advance(){if(question<lessons[lesson].qs.length-1){question++;selected=null;checked=false;render()}else{let first=award(lesson);let i=lesson;lesson=null;tab="Learn";app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:58px">🏅</div><h2>Lesson complete!</h2><p>'+esc(lessons[i].title)+'</p><h2>'+(first?(mistakes===0?"+40 XP":"+25 XP"):"Review complete")+'</h2><p class="muted">'+(mistakes===0?"Perfect round!":mistakes+" question(s) missed. Review explanations and try again.")+'</p>'+button("Next lesson","start("+Math.min(i+1,lessons.length-1)+")")+' '+button("Learning path","go(\'Learn\')","secondary")+'</section>';updateHeader()}}
function updateHeader(){setMarketBackdrop(tab);document.getElementById("xpTop").textContent=state.xp+" XP";nav.innerHTML=["Home","Learn","Play","Compete","Profile"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+({Home:"⌂",Learn:"📚",Play:"🎮",Compete:"🏆",Profile:"👤"}[t])+'<br>'+t+'</button>').join("")}
function render(){updateHeader();if(lesson!==null)return renderLesson();if(tab==="Home")return renderHome();if(tab==="Learn")return renderLearn();if(tab==="Play")return renderPlay();if(tab==="Compete")return renderCompete();renderProfile()}

let activeChart=0,chartTask=0,chartFeedback="",chartAnswer="";
function chartSVG(series){const W=640,H=286,padL=52,padR=14,top=18,bottom=34,lo=Math.min(...series.map(x=>x.l))-2,hi=Math.max(...series.map(x=>x.h))+2,scale=v=>top+(hi-v)/(hi-lo)*(H-top-bottom),step=(W-padL-padR)/series.length;
let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Illustrative candlestick chart, with open, high, low and close values listed below" style="width:100%;height:auto;background:#f7fbf8;border-radius:16px">';
for(let i=0;i<=4;i++){let price=lo+(hi-lo)*i/4,y=scale(price);s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#d9e8df" stroke-dasharray="4 4"/><text x="5" y="'+(y+4)+'" fill="#587467" font-size="12">'+price.toFixed(1)+'</text>'}
series.forEach((p,i)=>{let x=padL+step*(i+.5),color=p.c>=p.o?"#087f4f":"#df5b65",yt=scale(Math.max(p.o,p.c)),yb=scale(Math.min(p.o,p.c)),w=Math.min(40,step*.52);s+='<line x1="'+x+'" y1="'+scale(p.h)+'" x2="'+x+'" y2="'+scale(p.l)+'" stroke="'+color+'" stroke-width="4"/><rect x="'+(x-w/2)+'" y="'+yt+'" width="'+w+'" height="'+Math.max(2,yb-yt)+'" rx="3" fill="'+color+'"/><text x="'+x+'" y="'+(H-12)+'" text-anchor="middle" fill="#587467" font-size="14">'+(i+1)+'</text>'});
return s+'</svg>'}

const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
function questionGenerator(path,type,tier,k){
let a=0,b=0,answer=0,prompt="",explain="",unit="$";
const seed=k+1+tier*7;
switch(path){
case "personal":
switch(type){
case 0:a=2200+seed*115;b=15+(seed%6)*5;answer=round2(a*b/100);prompt="Monthly take-home pay is $"+a+". Save "+b+"%. How many dollars go to savings?";explain=a+" × "+b+"% = $"+answer;break;
case 1:a=900+seed*45;b=3+seed%5;answer=a*b;prompt="Essential monthly spending is $"+a+". How much covers "+b+" months?";explain=a+" × "+b+" = $"+answer;break;
case 2:a=2400+seed*180;b=6+seed%13;answer=round2(a/b);prompt="You need $"+a+" in "+b+" months, starting from zero with no interest. Monthly saving ($)?";explain=a+" ÷ "+b+" = $"+answer;break;
case 3:a=1000+seed*120;b=5+seed%11;answer=round2(a*b/1200);prompt="Balance $"+a+" at "+b+"% APR. Approximate one month of simple interest ($)?";explain=a+" × "+b+"% ÷ 12 = $"+answer;break;
case 4:a=500+seed*45;b=3000+seed*100;answer=round2(100*a/b);prompt="Card balance $"+a+", credit limit $"+b+". Utilization (%)?";explain=a+" ÷ "+b+" × 100 = "+answer+"%";unit="%";break;
case 5:a=1000+seed*150;b=2+seed%9;answer=round2(a*(1+b/100));prompt="Deposit $"+a+" at "+b+"% annual interest for one year. End balance ($)?";explain=a+" × (1 + "+b+"%) = $"+answer;break;
case 6:a=100+seed*15;b=2+seed%7;answer=round2(a*(1+b/100));prompt="An item costs $"+a+". After "+b+"% inflation, its price ($)?";explain=a+" × (1 + "+b+"%) = $"+answer;break;
case 7:a=700+seed*65;b=2600+seed*130;answer=round2(100*a/b);prompt="Monthly rent is $"+a+" and take-home pay $"+b+". Rent as % of pay?";explain=a+" ÷ "+b+" × 100 = "+answer+"%";unit="%";break;
case 8:a=2800+seed*120;b=12+seed%15;answer=round2(a*(1-b/100));prompt="Gross monthly pay $"+a+", simplified withholding "+b+"%. Net pay ($)?";explain=a+" × (1 − "+b+"%) = $"+answer+". Actual taxes vary.";break;
default:a=5000+seed*350;b=900+seed*90;answer=a-b;prompt="Assets $"+a+", liabilities $"+b+". Net worth ($)?";explain=a+" − "+b+" = $"+answer;
}break;
case "investing":
switch(type){
case 0:a=1000+seed*120;b=2+seed%9;answer=round2(a*Math.pow(1+b/100,2));prompt="Invest $"+a+" at a hypothetical constant "+b+"% annual return for 2 years. End value ($)?";explain=a+" × (1 + "+b+"%)² = $"+answer;break;
case 1:a=5000+seed*420;b=0.1+(seed%8)*0.1;answer=round2(a*b/100);prompt="ETF holdings $"+a+", expense ratio "+b.toFixed(1)+"%. Approximate annual fee ($)?";explain=a+" × "+b.toFixed(1)+"% = $"+answer;break;
case 2:a=4000+seed*300;b=20+(seed%7)*10;answer=a*b/100;prompt="Portfolio $"+a+". Target stock weight "+b+"%. Stock allocation ($)?";explain=a+" × "+b+"% = $"+answer;break;
case 3:a=20+seed*2;b=50+seed*3;answer=a*b;prompt="Own "+a+" shares. Annual dividend $"+b+" cents per share. Dividend cash ($)?";answer=round2(a*b/100);explain=a+" × $"+(b/100).toFixed(2)+" = $"+answer;break;
case 4:a=20+(seed%6)*10;b=3+seed%12;answer=round2(a*b/100);prompt="An asset weighted "+a+"% returns "+b+"%. Contribution to portfolio return (percentage points)?";explain=a+"% × "+b+"% = "+answer+" percentage points";unit="pp";break;
case 5:a=6000+seed*250;b=30+(seed%6)*10;answer=a*b/100;prompt="Portfolio $"+a+", target bonds "+b+"%. Target bond holdings ($)?";explain=a+" × "+b+"% = $"+answer;break;
case 6:a=12+seed;b=2+seed%7;answer=a*b;prompt="Stock price $"+a+", earnings per share $"+b+". P/E ratio?";answer=round2(a/b);explain=a+" ÷ "+b+" = "+answer;unit="×";break;
case 7:a=5+seed%12;b=20+seed;answer=round2((a*10+b*10)/20);prompt="Buy 10 shares at $"+a+" and 10 at $"+b+". Average cost per share ($)?";explain="("+a+" × 10 + "+b+" × 10) ÷ 20 = $"+answer;break;
case 8:a=4+seed%12;b=2+seed%5;answer=round2(((1+a/100)/(1+b/100)-1)*100);prompt="Nominal return "+a+"%, inflation "+b+"%. Exact real return (%)?";explain="((1 + "+a+"%) ÷ (1 + "+b+"%) − 1) × 100 = "+answer+"%";unit="%";break;
default:a=10+(seed%7)*5;answer=round2(100*a/(100-a));prompt="Portfolio loses "+a+"%. Gain needed from the new value to recover (%)?";explain=a+" ÷ (100 − "+a+") × 100 = "+answer+"%";unit="%";
}break;
default:
switch(type){
case 0:a=4000+seed*200;b=1+seed%3;let dist=2+seed%6;answer=Math.floor(a*b/100/dist);prompt="Account $"+a+", risk "+b+"%, stop distance $"+dist+". Maximum whole shares?";explain="Floor("+a+" × "+b+"% ÷ $"+dist+") = "+answer;unit="shares";break;
case 1:a=2+seed%7;b=3+seed%14;answer=round2(b/a);prompt="Risk $"+a+" per share, potential reward $"+b+". Reward-to-risk ratio (number)?";explain=b+" ÷ "+a+" = "+answer;unit=":1";break;
case 2:a=30+seed;b=5+seed%15;answer=round2(b/100);prompt="Bid $"+a+".00, ask $"+a+"."+(b<10?"0":"")+b+". Spread ($)?";explain="Ask − bid = $"+answer;break;
case 3:a=5+seed%30;b=2+seed%12;let fee=2+seed%8;answer=a*b-fee;prompt="Buy "+a+" shares, sell for $"+b+" more per share, total fees $"+fee+". Net P&L ($)?";explain=a+" × "+b+" − "+fee+" = $"+answer;break;
case 4:a=1000+seed*150;b=2+seed%6;answer=a*b;prompt="Account equity $"+a+" with "+b+"× gross leverage. Notional exposure ($)?";explain=a+" × "+b+" = $"+answer+". Leverage magnifies losses too.";break;
case 5:a=40+seed;b=1+seed%12;answer=b;prompt="Candle opens $"+a+" and closes $"+(a+b)+". Body size ($)?";explain="|"+(a+b)+" − "+a+"| = $"+answer;break;
case 6:a=60+seed;b=2+seed%9;answer=b;prompt="Candle opens $"+a+", closes $"+(a+2)+", high $"+(a+2+b)+". Upper wick ($)?";explain=(a+2+b)+" − "+(a+2)+" = $"+answer;break;
case 7:a=20+(seed%6)*10;b=5+seed%25;let loss=2+seed%8;answer=round2(a*b/100-(100-a)*loss/100);prompt="Win rate "+a+"%, average win $"+b+", average loss $"+loss+". Expected P&L per trade ($)?";explain=a+"% × "+b+" − "+(100-a)+"% × "+loss+" = $"+answer;break;
case 8:a=2+seed%8;b=2+seed%5;answer=round2(Math.pow(1-b/100,a)*100);prompt="Starting capital 100 units, "+a+" consecutive losses of "+b+"% each. Remaining capital?";explain="100 × (1 − "+b+"%)^"+a+" = "+answer;unit="units";break;
default:a=10+seed%25;b=2+seed%10;answer=round2(100*b/a);prompt="Trade journal has "+a+" trades, "+b+" winners. Win rate (%)?";explain=b+" ÷ "+a+" × 100 = "+answer+"%";unit="%";
}
}
return {q:prompt,answer,explain,unit,kind:k%3===0?"fill":k%3===1?"choice":"estimate",id:path+"-"+type+"-"+tier+"-"+k}
}
const newLessonStart=lessons.length;
for(const path of careerPaths){for(let tier=0;tier<4;tier++){for(let i=0;i<path.lessons.length;i++){let [title,explain]=path.lessons[i];lessons.push({unit:path.name,title:title+" · "+careerLevels[tier],explain,career:path.id,tier,qs:Array.from({length:18},(_,k)=>questionGenerator(path.id,i,tier,k))})}}}
state.path ||= "personal";
state.lessonScores ||= {};
const levelNames=["Finance NPC","Budget Goblin","Spreadsheet Gremlin","Market Muncher","Side Quest Investor","Chart Goblin","Diamond Hands Apprentice","Portfolio Wizard","Yieldmaxxer","Risk Management Chad","Quant Brainrot Legend","Ultra Giga Chad Finance Bro"];
function rankInfo(){let xp=state.xp||0,perfect=state.perfect||0,stages=state.done.length;let score=xp+perfect*15+stages*10,idx=Math.min(levelNames.length-1,Math.floor(score/850));return {name:levelNames[idx],index:idx,score,next:(idx+1)*850,level:idx+1}}
function careerLessonIndices(path){return lessons.map((l,i)=>l.career===path?i:-1).filter(i=>i>=0)}
function currentCareerLevel(){let indices=careerLessonIndices(state.path);return indices.find(i=>!state.done.includes(i))??indices[indices.length-1]}
function choosePath(id){if(!careerPaths.some(p=>p.id===id))return;state.path=id;save();lesson=null;tab="Home";render()}
function pathSelect(){return '<div class="path-selector">'+careerPaths.map(p=>'<button class="career-card '+(state.path===p.id?"chosen":"")+'" onclick="choosePath(\''+p.id+'\')"><span class="career-icon">'+p.emoji+'</span><strong>'+p.name+'</strong><small>'+p.desc+'</small><span class="career-status">'+careerLessonIndices(p.id).filter(i=>state.done.includes(i)).length+'/40 stages '+(state.path===p.id?"· ACTIVE":"")+'</span></button>').join("")+'</div>'}
function careerMap(){const path=careerPaths.find(p=>p.id===state.path),ids=careerLessonIndices(state.path),next=currentCareerLevel(),rank=rankInfo(),finished=ids.every(i=>state.done.includes(i));app.innerHTML='<div class="journey-top"><div class="journey-profile">'+avatarSVG(66)+'<div><div class="eyebrow">LEVEL '+rank.level+' · '+rank.name+'</div><strong>'+esc(state.avatar.name)+'</strong><div class="muted">'+state.xp+' XP · '+state.done.length+' stages cleared</div></div></div><button class="btn secondary" onclick="go(\'Profile\')">Customize ✨</button></div><div class="stats"><span class="pill">🔥 '+state.streak+' day streak</span><span class="pill">⭐ '+state.xp+' XP</span><span class="pill">🏆 '+rank.name+'</span></div><h2>Choose your adventure</h2><p class="muted">Switch between three paths whenever you like. Each path has 40 stages across four difficulty tiers.</p>'+pathSelect()+'<section class="quest-banner"><div class="eyebrow">CURRENT QUEST · '+path.emoji+' '+path.name+'</div><h2>'+(finished?"Path conquered!":esc(lessons[next].title))+'</h2><p>'+(finished?"You can replay any stage or switch paths.":"Your avatar moves forward as you finish each stage.")+'</p>'+button(finished?"Replay final stage":"Play next stage →","start("+next+")")+'</section><div class="map-hint">🗺️ Complete stages in order to unlock new territory</div>'+Array.from({length:4},(_,tier)=>'<div class="world-banner world-'+(tier%6)+'"><span class="world-emoji">'+["🌱","🔥","⚔️","👑"][tier]+'</span><div><small>CHAPTER '+(tier+1)+'/4</small><h2>'+careerLevels[tier]+' League</h2><p>'+ids.slice(tier*10,tier*10+10).filter(i=>state.done.includes(i)).length+'/10 stages</p></div></div><div class="game-path">'+ids.slice(tier*10,tier*10+10).map(i=>careerStage(i,ids,next)).join("")+'</div>').join("")+'<section class="card"><h3>🎮 Arcade side quests</h3><p>Play chart puzzles and trading math challenges anytime.</p>'+button("Visit arcade","go(\'Play\')","secondary")+'</section>'}
function careerStage(i,ids,next){let complete=state.done.includes(i),locked=ids.indexOf(i)>ids.indexOf(next),pos=i===next,offset=[0,58,18,-50][ids.indexOf(i)%4];return '<div class="stage-row" style="--shift:'+offset+'px"><div class="stage-wrap">'+(pos?'<div class="walking-avatar">'+avatarSVG(58)+'</div>':"")+'<button class="stage '+(complete?"complete":locked?"locked":"current")+'" '+(locked?"disabled":"onclick=\"start("+i+")\"")+' aria-label="'+esc(lessons[i].title)+'">'+(complete?"✓":locked?"🔒":"⚡")+'</button><div class="stage-caption"><strong>'+esc(lessons[i].title)+'</strong><small>'+(complete?"Completed · Replay":locked?"Unlock by playing":"START · 18 challenges")+'</small></div></div></div>'}
function generatedOptions(q){let a=q.answer,step=Math.max(1,Math.round(Math.abs(a)*.12*100)/100),values=[a,round2(a+step),round2(a-step)];let shift=(q.id.length+q.q.length)%3;return {options:[...values.slice(shift),...values.slice(0,shift)].map(v=>String(v)),correct:(3-shift)%3}}
function renderGeneratedLesson(){let l=lessons[lesson],q=l.qs[question],opts=generatedOptions(q),isFill=q.kind!=="choice";app.innerHTML='<div class="eyebrow">'+esc(l.unit)+' · '+esc(careerLevels[l.tier])+' · '+(question+1)+'/18</div><div class="bar" style="margin:12px 0"><div style="width:'+((question+1)/18*100)+'%"></div></div><section class="card"><div class="eyebrow">'+(q.kind==="fill"?"✍️ FILL IN THE BLANK":q.kind==="estimate"?"🧮 CALCULATE":"🎯 PICK AN ANSWER")+'</div><h2>'+esc(l.title)+'</h2><p>'+esc(l.explain)+'</p><h3>'+esc(q.q)+'</h3>'+(isFill?'<input id="generatedAnswer" type="number" step="any" placeholder="Enter a number" aria-label="Numeric answer" value="'+(selected===null?"":esc(selected))+'" '+(checked?"disabled":"")+' class="game-input">':'<div class="choices">'+opts.options.map((o,i)=>'<button class="choice '+(selected===i?"selected":"")+'" '+(checked?"disabled":"")+' onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+'</div>')+(checked?'<div class="feedback '+(answerWasCorrect?"":"bad")+'"><b>'+(answerWasCorrect?"✓ Nailed it!":"✕ Not quite!")+'</b><p>'+esc(q.explain)+'</p></div>':"")+(checked?button(question===17?"Claim XP & finish":"Next challenge →","advance()"):button("Check answer","check()"))+' '+button("Exit","go(\'Home\')","secondary")+'</section>'}
let answerWasCorrect=false;
const previousStart=start,previousCheck=check,previousAdvance=advance,previousRenderLesson=renderLesson;
start=function(i){if(i>=newLessonStart){let ids=careerLessonIndices(lessons[i].career),next=ids.findIndex(id=>!state.done.includes(id));if(next>=0&&ids.indexOf(i)>next){alert("Finish the previous stage first!");return}}previousStart(i)};
renderLesson=function(){if(lesson>=newLessonStart)return renderGeneratedLesson();return previousRenderLesson()};
check=function(){if(lesson<newLessonStart)return previousCheck();let q=lessons[lesson].qs[question];if(q.kind==="choice"){if(selected===null)return;answerWasCorrect=selected===generatedOptions(q).correct}else{let el=document.getElementById("generatedAnswer");if(!el||el.value.trim()==="")return;selected=Number(el.value);answerWasCorrect=Math.abs(selected-q.answer)<.011}checked=true;state.attempts++;if(!answerWasCorrect)mistakes++;save();render()};
advance=function(){if(lesson<newLessonStart)return previousAdvance();if(question<17){question++;selected=null;checked=false;answerWasCorrect=false;render()}else{let i=lesson,first=award(i);state.lessonScores[i]={correct:18-mistakes,total:18,at:Date.now()};save();lesson=null;tab="Home";app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:58px">🏆</div><h2>Stage cleared!</h2><p>'+esc(lessons[i].title)+'</p><h2>'+(first?(mistakes===0?"+40 XP":"+25 XP"):"Review complete")+'</h2><p>'+Math.max(0,18-mistakes)+'/18 correct · '+rankInfo().name+'</p>'+button("Continue adventure","go(\'Home\')")+'</section>';updateHeader()}};
renderHome=function(){careerMap()};
renderLearn=function(){careerMap()};
const oldProfile=renderProfile;
renderProfile=function(){oldProfile();app.innerHTML='<section class="card"><div class="eyebrow">RANK LADDER</div><h2>🏅 '+rankInfo().name+'</h2><p>Earn ranks by clearing stages, scoring perfect rounds and collecting XP.</p><div class="rank-list">'+levelNames.map((name,i)=>'<div class="rank-entry '+(i===rankInfo().index?"rank-active":"")+'"><span>'+((i+1)<=rankInfo().level?"🏅":"🔒")+'</span><strong>'+name+'</strong><small>'+((i)*850)+' points</small></div>').join("")+'</div></section>'+app.innerHTML};


/* Real leaderboard client: dormant until cloud-config.js contains a project. */
let cloud=null,cloudUser=null,cloudBoard=[],cloudProfile=null,cloudError="",cloudBusy=false;
function cloudReady(){return Boolean(window.CANDLE_CLOUD?.url&&window.CANDLE_CLOUD?.anonKey&&window.supabase?.createClient)}
async function cloudInit(){if(!cloudReady())return;try{cloud=window.supabase.createClient(window.CANDLE_CLOUD.url,window.CANDLE_CLOUD.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data}=await cloud.auth.getUser();cloudUser=data?.user||null;cloud.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(tab==="Compete")setTimeout(()=>cloudRefresh(),0)});if(cloudUser)await cloudRefresh()}catch(e){cloudError=e.message}}
async function cloudCall(name,args={}){if(!cloud)throw Error("Leaderboard is not configured");const {data,error}=await cloud.rpc(name,args);if(error)throw Error(error.message);return data}
async function cloudRefresh(){if(!cloud||!cloudUser){if(tab==="Compete")renderCompete();return}try{cloudBusy=true;let p=await cloudCall("candle_ensure_profile",{p_name:state.avatar.name||"Explorer"});cloudProfile=p?.[0]||null;cloudBoard=await cloudCall("candle_leaderboard",{p_scope:"friends"});cloudError=""}catch(e){cloudError=e.message}finally{cloudBusy=false;if(tab==="Compete")renderCompete()}}
async function cloudSignIn(){let email=document.getElementById("leaderEmail")?.value?.trim();if(!email||!email.includes("@")){cloudError="Enter a valid email address.";renderCompete();return}try{const {error}=await cloud.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;cloudError="Check your email for a secure sign-in link."}catch(e){cloudError=e.message}renderCompete()}
async function cloudSignOut(){if(cloud)await cloud.auth.signOut();cloudUser=null;cloudBoard=[];cloudProfile=null;renderCompete()}
async function cloudAddFriend(){let code=document.getElementById("friendCode")?.value?.trim();if(!code)return;try{let name=await cloudCall("candle_add_friend",{p_code:code});cloudError="Added "+name+" to your leaderboard.";await cloudRefresh()}catch(e){cloudError=e.message}renderCompete()}
async function cloudSyncStage(id,perfect){if(!cloud||!cloudUser)return;try{await cloudCall("candle_complete_stage",{p_stage_id:id,p_perfect:perfect});if(tab==="Compete")await cloudRefresh()}catch(e){cloudError="Score sync failed: "+e.message}}
const originalAward=award;
award=function(id){let first=originalAward(id);if(first&&cloudUser)void cloudSyncStage(id,mistakes===0);return first};
renderCompete=function(){
let html='<section class="card"><div class="eyebrow">CANDLE SOCIAL</div><h2>🏆 Friends leaderboard</h2><p class="muted">Compare learning XP with friends. Weekly scores reset each Monday (UTC); lifetime XP keeps accumulating.</p>';
if(!cloudReady()){html+='<div class="cloud-note"><strong>Cloud leaderboard setup required</strong><p>This website is not yet connected to a shared database. Friends and scores cannot sync until the project owner configures Supabase. No simulated rankings are shown.</p></div>'}
else if(!cloudUser){html+='<p>Sign in to save a shared score and compare with friends.</p><label for="leaderEmail">Email address</label><input class="game-input" id="leaderEmail" type="email" autocomplete="email" placeholder="you@example.com">'+button("Email me a sign-in link","cloudSignIn()")}
else{html+='<div class="stats"><span class="pill">👤 '+esc(cloudUser.email||"Signed in")+'</span><span class="pill">🔑 '+esc(cloudProfile?.friend_code||"Loading…")+'</span></div><p class="muted">Share your friend code. Adding a friend lets you see their score; they must also add your code to see yours.</p><div class="friend-row"><input id="friendCode" maxlength="8" placeholder="Friend code" aria-label="Friend code">'+button("Add friend","cloudAddFriend()","secondary")+'</div><div class="leader-table"><div class="leader-row leader-head"><span>Rank</span><span>Player</span><span>Weekly XP</span><span>All-time XP</span></div>'+cloudBoard.map((p,i)=>'<div class="leader-row"><span>'+(i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1))+'</span><span>'+esc(p.display_name)+(p.is_self?" (you)":"")+'</span><strong>'+Number(p.weekly_xp||0)+'</strong><span>'+Number(p.lifetime_xp||0)+'</span></div>').join("")+'</div>'+(cloudBoard.length===0?'<p class="muted">No scores yet. Finish a stage and invite friends.</p>':"")+'<div class="leader-actions">'+button("Refresh scores","cloudRefresh()","secondary")+' '+button("Sign out","cloudSignOut()","secondary")+'</div>'}
if(cloudError)html+='<p class="cloud-message" role="status">'+esc(cloudError)+'</p>';
html+='</section><section class="card"><h3>🎖️ Your achievements</h3><p class="muted">Earned through learning, not simulated trading profits.</p>'+[[1,"First Spark"],[10,"Getting Started"],[40,"Committed Learner"],[100,"Century Club"]].map(([n,name])=>'<div class="node"><span class="circle">'+(state.done.length>=n?"🏅":"🔒")+'</span><div><strong>'+name+'</strong><div class="muted">Complete '+n+' stages</div></div></div>').join("")+'</section>';app.innerHTML=html;
};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",cloudInit);else cloudInit();

render();</script></body></html>
