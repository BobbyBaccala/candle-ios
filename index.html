<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f4f"><title>Candle · Learn the markets</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17352b;background:#f8fcf9}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{background:#087f4f;color:white;padding:22px 20px;border-radius:0 0 28px 28px}header .top{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}h1{margin:0;font-size:29px}main{max-width:760px;margin:22px auto 105px;padding:0 16px}.sub{opacity:.82}.card{background:white;border:1px solid #e1eee6;border-radius:23px;padding:23px;margin:14px 0;box-shadow:0 8px 22px #087f4f0a}.eyebrow{color:#087f4f;font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.btn{background:#087f4f;color:white;border:0;border-radius:16px;padding:14px 22px;font-weight:800;box-shadow:0 4px #064e3b}.btn:active{transform:translateY(3px);box-shadow:0 1px #064e3b}.btn.secondary{background:#ddf7e8;color:#064e3b;box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}.choices{display:grid;gap:11px;margin:20px 0}.choice{border:2px solid #d7e8de;background:white;padding:15px;text-align:left;border-radius:14px;color:#17352b}.choice.selected{border-color:#087f4f;background:#ddf7e8}.pill{background:#ddf7e8;border-radius:100px;padding:7px 12px;color:#064e3b;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.bar{background:#e1eee6;height:12px;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:#16c784;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{background:white;border:1px solid #e1eee6;border-radius:20px;padding:18px;text-align:left}.tile strong{display:block;margin:8px 0}.muted{color:#70877b}.feedback{background:#ddf7e8;padding:16px;border-radius:16px;margin:15px 0}.feedback.bad{background:#fff0f1}nav{position:fixed;bottom:0;background:white;border-top:1px solid #d7e8de;width:100%;display:flex;justify-content:center;padding:9px 3px max(12px,env(safe-area-inset-bottom));gap:4px}nav button{border:0;background:none;padding:9px 10px;border-radius:12px;color:#70877b;font-weight:700;font-size:12px}nav button.active{background:#ddf7e8;color:#087f4f}.node{display:flex;gap:15px;align-items:center;padding:14px;border-bottom:1px solid #edf4ef}.circle{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:#ddf7e8;font-size:25px;flex-shrink:0}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><div class="top"><div><h1>🕯 Candle</h1><div class="sub">Master the markets. One day at a time.</div></div><span class="pill" id="xpTop">0 XP</span></div></header><main id="app"></main><nav id="nav"></nav><script>
const lessons=[
{title:"What is a stock?",unit:"Markets 101",explain:"A share represents partial ownership in a corporation. Prices can rise or fall, and ownership does not guarantee returns.",q:"What does owning one share generally represent?",options:["A guaranteed profit","Partial ownership of a company","A loan to the government"],correct:1,why:"Common shares represent an ownership interest, not a guaranteed return."},
{title:"Bid vs. ask",unit:"Markets 101",explain:"The bid is the highest displayed buying price; the ask is the lowest displayed selling price. Their difference is the quoted spread.",q:"Bid: $24.90. Ask: $25.00. What is the quoted spread?",options:["$0.10","$0.90","$49.90"],correct:0,why:"Spread = ask − bid = $25.00 − $24.90 = $0.10."},
{title:"Market vs. limit orders",unit:"Markets 101",explain:"A market order prioritizes execution, not a guaranteed price. A limit order sets a worst acceptable price but may not fill.",q:"Which order might not execute if the market never reaches your price?",options:["Market order","Limit order","Both always fill"],correct:1,why:"Limit orders are price-constrained; execution is not guaranteed."},
{title:"Reading a candle",unit:"Reading Charts",explain:"OHLC stands for open, high, low and close. A candle's body connects open and close; wicks extend to the high and low.",q:"Open $100, close $104. Is this candle up or down?",options:["Up","Down","Impossible to tell"],correct:0,why:"Close is $4 above open. This describes the past interval, not the next one."},
{title:"Trading costs",unit:"Market Mechanics",explain:"Fees, spread and slippage reduce net trading returns. Frequent trading can compound these costs.",q:"Gross gain $20 and total trading costs $7. Net gain?",options:["$27","$13","$20"],correct:1,why:"Net gain = $20 − $7 = $13."},
{title:"Expected value",unit:"Risk Management",explain:"Expected value is the probability-weighted average of possible outcomes, before accounting for uncertainty in estimates.",q:"50% chance of +$10, 50% chance of −$10. Expected value?",options:["+$10","−$10","$0"],correct:2,why:"0.5×10 + 0.5×(−10) = $0, before costs."}
];
const key="candle-browser-v1";let state;try{state=JSON.parse(localStorage.getItem(key))||{xp:0,done:[],streak:0,last:"",attempts:0}}catch{state={xp:0,done:[],streak:0,last:"",attempts:0}};let tab="Home",lesson=null,chosen=null,checked=false,game="risk",riskAnswer="";const app=document.getElementById("app");const nav=document.getElementById("nav");function save(){localStorage.setItem(key,JSON.stringify(state))}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function today(){return new Date().toLocaleDateString("en-CA")}function reward(id){if(!state.done.includes(id)){state.done.push(id);state.xp+=20;let d=today();if(state.last!==d){let prev=new Date();prev.setDate(prev.getDate()-1);state.streak=state.last===prev.toLocaleDateString("en-CA")?state.streak+1:1;state.last=d}save()}}function btn(text,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+text+'</button>'}function render(){document.getElementById("xpTop").textContent=state.xp+" XP";nav.innerHTML=["Home","Learn","Play","Compete","Profile"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+({Home:"⌂",Learn:"📚",Play:"🎮",Compete:"🏆",Profile:"👤"}[t])+'<br>'+t+'</button>').join("");if(lesson!==null)return renderLesson();if(tab==="Home"){app.innerHTML='<div class="stats"><span class="pill">🔥 '+state.streak+' day streak</span><span class="pill">⭐ '+state.xp+' XP</span><span class="pill">✓ '+state.done.length+'/'+lessons.length+' lessons</span></div><section class="card"><div class="eyebrow">Today’s lesson</div><h2>Build your market knowledge</h2><p class="muted">Learn in short sessions. Understand the risks before you trade.</p><div class="bar"><div style="width:'+(state.done.length/lessons.length*100)+'%"></div></div><p>'+state.done.length+' of '+lessons.length+' lessons complete</p>'+btn("Continue learning →","start("+(lessons.findIndex((_,i)=>!state.done.includes(i))<0?0:lessons.findIndex((_,i)=>!state.done.includes(i)))+")")+'</section><h2>Your learning path</h2>'+lessons.map((l,i)=>'<div class="node"><span class="circle">'+(state.done.includes(i)?"✓":"📈")+'</span><div style="flex:1"><strong>'+l.title+'</strong><div class="muted">'+l.unit+'</div></div><button class="btn secondary" onclick="start('+i+')">'+(state.done.includes(i)?"Review":"Start")+'</button></div>').join("")}else if(tab==="Learn"){app.innerHTML='<h2>Learn the markets</h2><p class="muted">Complete bite-sized lessons and revisit difficult ideas.</p>'+lessons.map((l,i)=>'<section class="card"><div class="eyebrow">'+l.unit+'</div><h3>'+l.title+'</h3>'+btn(state.done.includes(i)?"Review lesson":"Start lesson","start("+i+")","secondary")+'</section>').join("")}else if(tab==="Play"){renderGame()}else if(tab==="Compete"){app.innerHTML='<section class="card"><div class="eyebrow">Coming later</div><h2>🏆 Learning leagues</h2><p>Friends and leagues are planned for a future release. Rankings will reward learning, not simulated profits.</p><p>Your current XP: <b>'+state.xp+'</b></p></section>'}else{app.innerHTML='<section class="card"><h2>👤 Your profile</h2><div class="stats"><span class="pill">'+state.xp+' XP</span><span class="pill">'+state.streak+' day streak</span><span class="pill">'+state.done.length+' lessons</span></div><p class="muted">Progress is saved on this device only. Clearing browser storage will erase it.</p>'+btn("Reset progress","reset()","secondary")+'</section><section class="card"><h3>About Candle</h3><p>Educational prototype only. No real trades or investment advice. Lesson content is illustrative and requires expert source review before release.</p></section>'}}function go(t){tab=t;lesson=null;render()}function start(i){lesson=i;chosen=null;checked=false;render()}function choose(i){if(checked)return;chosen=i;render()}function check(){if(chosen===null)return;checked=true;state.attempts++;if(chosen===lessons[lesson].correct)reward(lesson);save();render()}function next(){let i=lesson;lesson=null;tab="Learn";if(i+1<lessons.length)start(i+1);else render()}function renderLesson(){let l=lessons[lesson];app.innerHTML='<div class="eyebrow">'+l.unit+' · Lesson '+(lesson+1)+'</div><section class="card"><h2>'+l.title+'</h2><p>'+l.explain+'</p><h3>'+l.q+'</h3><div class="choices">'+l.options.map((o,i)=>'<button class="choice '+(chosen===i?"selected":"")+'" onclick="choose('+i+')">'+escapeHTML(o)+'</button>').join("")+'</div>'+(checked?'<div class="feedback '+(chosen===l.correct?"":"bad")+'"><b>'+(chosen===l.correct?"Correct! +20 XP (first completion)":"Not quite — try reviewing the explanation.")+'</b><p>'+l.why+'</p></div>':'')+(checked?btn("Next →","next()"):btn("Check answer","check()"))+' '+btn("Exit","go(\'Learn\')","secondary")+'</section>'}function renderGame(){app.innerHTML='<h2>🎮 Trading arcade</h2><div class="grid"><button class="tile" onclick="game=\'risk\';render()"><div>🛡️</div><strong>Risk Manager</strong><small>Position sizing</small></button><button class="tile" onclick="game=\'profit\';render()"><div>🧮</div><strong>Profit or Loss</strong><small>Net P&L</small></button><button class="tile" onclick="game=\'candle\';render()"><div>🕯️</div><strong>Candle Decoder</strong><small>OHLC</small></button></div><section class="card"><div class="eyebrow">Mini-game</div><h2>'+({risk:"Risk Manager",profit:"Profit or Loss",candle:"Candle Decoder"}[game])+'</h2><p>'+({risk:"Account: $10,000. Maximum risk: 1% ($100). Entry: $50. Stop: $48. Ignoring gaps and fees, what is the maximum number of shares?",profit:"Buy 10 shares at $20, sell at $23. Total fees: $4. What is your net profit in dollars?",candle:"A candle opens at $80, reaches a high of $85, a low of $78 and closes at $82. What is the upper wick length in dollars?"}[game])+'</p><input id="answer" type="number" step="any" value="'+escapeHTML(riskAnswer)+'" placeholder="Enter your answer" style="width:100%;padding:15px;border:2px solid #d7e8de;border-radius:12px;font:inherit;margin-bottom:14px"><div id="result"></div>'+btn("Check answer","checkGame()")+'</section>'}function checkGame(){let a=Number(document.getElementById("answer").value),raw=document.getElementById("answer").value;let correct={risk:50,profit:26,candle:3}[game];document.getElementById("result").innerHTML='<div class="feedback '+(raw!==""&&Math.abs(a-correct)<.0001?"":"bad")+'">'+(raw!==""&&Math.abs(a-correct)<.0001?"Correct!":"Not quite.")+' '+({risk:"Risk budget $100 ÷ $2 risk per share = 50 shares. Actual losses can exceed this estimate.",profit:"(23 − 20) × 10 − 4 = $26.",candle:"High $85 − max(open $80, close $82) = $3."}[game])+'</div>'}function reset(){if(confirm("Erase all local progress?")){localStorage.removeItem(key);location.reload()}}render();
</script></body></html>
