</script><script src="cloud-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script></head><body><header><div class="top"><div><h1>🕯 Candle</h1><div class="sub">Master the markets. One day at a time.</div></div><div class="header-resources"><button id="energyTop" class="energy-top" type="button" onclick="showEnergyInfo()" aria-label="Energy status">⚡ 15/15</button><span class="pill" id="xpTop">0 XP</span></div></div></header><main id="app"></main><nav id="nav"></nav><script>
const topics=[["Market Foundations",[["Asset classes",""],["Order books",""],["Order types",""],["Liquidity & slippage",""],["Fees & returns",""]]],["Chart Literacy",[["OHLC anatomy",""],["Timeframes & noise",""],["Support & resistance",""],["Volume & volatility",""],["Moving averages",""]]],["Risk Management",[["Risk per trade",""],["Position sizing",""],["Risk/reward",""],["Diversification",""],["Drawdowns",""]]],["Fundamentals",[["Revenue, profit & cash",""],["Balance sheets",""],["Market capitalization",""],["Valuation multiples",""],["ETFs & index funds",""]]],["Economics & Rates",[["Inflation & purchasing power",""],["Interest rates",""],["Compounding",""],["Economic indicators",""],["Central banks",""]]],["Portfolio Strategy",[["Asset allocation",""],["Correlation",""],["Expected value",""],["Behavioral biases",""],["Paper trading & review",""]]]];
const lessons=topics.flatMap(([unit,items])=>items.map(([title,explain,...qs])=>({unit,title,explain,qs:qs.map(q=>({q:q[0],options:q.slice(1,4),correct:q[4]}))})));
const KEY="candle-browser-v2",OLD="candle-browser-v1";
let state;try{state=JSON.parse(localStorage.getItem(KEY)||"null");if(!state){let old=JSON.parse(localStorage.getItem(OLD)||"null");state={xp:0,done:[],streak:old?.streak||0,last:old?.last||"",attempts:0,perfect:0,gameWins:0}}}catch{state=null}
state ||= {xp:0,done:[],streak:0,last:"",attempts:0,perfect:0,gameWins:0};
let tab="Home",lesson=null,question=0,selected=null,checked=false,mistakes=0,game="position",gameRound=0,gameFeedback="",unitFilter="All";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function award(id){if(state.done.includes(id))return false;state.done.push(id);state.xp+=mistakes===0?40:25;if(mistakes===0)state.perfect++;const d=today();if(state.last!==d){let prev=new Date();prev.setDate(prev.getDate()-1);state.streak=state.last===prev.toLocaleDateString("en-CA")?state.streak+1:1;state.last=d}save();return true}
function button(t,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function go(t){tab=t;lesson=null;gameFeedback="";render()}
function start(i){lesson=i;question=0;selected=null;checked=false;mistakes=0;render()}
function choose(i){if(checked)return;selected=i;render()}
function check(){if(checked||selected===null)return;checked=true;state.attempts++;if(selected!==lessons[lesson].qs[question].correct)mistakes++;save();render()}
function advance(){
 if(lesson===null||!checked)return;
 const l=lessons[lesson];
 if(question<l.qs.length-1){question++;selected=null;checked=false;render();return}
 const i=lesson,total=l.qs.length,first=award(i);
 state.lessonScores[i]={correct:total-mistakes,total,at:Date.now(),curriculumVersion:l.curriculumVersion};save();
 lesson=null;tab='Learn';
 app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:58px">🏅</div><h2>Lesson complete!</h2><p>'+esc(l.title)+'</p><h2>'+(first?(mistakes===0?'+40 XP':'+25 XP'):'Review complete')+'</h2><p>'+Math.max(0,total-mistakes)+' / '+total+' correct</p>'+button('Learning path',"go('Learn')")+'</section>';updateHeader();
}

function updateHeader(){setMarketBackdrop(tab);document.getElementById("xpTop").textContent=state.xp+" XP";nav.innerHTML=["Home","Learn","Play","Compete","Profile"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+({Home:"⌂",Learn:"📚",Play:"🎮",Compete:"🏆",Profile:"👤"}[t])+'<br>'+t+'</button>').join("")}
function render(){updateHeader();if(lesson!==null)return renderLesson();if(tab==="Home")return renderHome();if(tab==="Learn")return renderLearn();if(tab==="Play")return renderPlay();if(tab==="Compete")return renderCompete();renderProfile()}

function worldOf(i){return Math.min(5,Math.floor(i/5))}
function worldProgress(w){let start=w*5;return Array.from({length:5},(_,j)=>state.done.includes(start+j)).filter(Boolean).length}
function currentLevel(){let n=lessons.findIndex((_,i)=>!state.done.includes(i));return n<0?lessons.length:n}
function worldCard(w){const icons=["🏛️","📊","🛡️","🏢","🌍","🧠"],names=["Market Village","Chart Canyon","Risk Fortress","Fundamental City","Macro Mountain","Portfolio Galaxy"];return '<div class="world-banner world-'+w+'"><span class="world-emoji">'+icons[w]+'</span><div><small>WORLD '+(w+1)+' / 6</small><h2>'+names[w]+'</h2><p>'+esc(topics[w][0])+' · '+worldProgress(w)+'/5 stages</p></div><span class="world-badge">'+(worldProgress(w)===5?"🏆":"✦")+'</span></div>'}
function pathNode(i){let complete=state.done.includes(i),next=currentLevel(),locked=i>next,side=i%4,offset=[0,65,18,-55][side],w=worldOf(i),icon=["💡","🎯","🧩","🔍","🏆"][i%5],pos=i===next;return '<div class="stage-row" style="--shift:'+offset+'px"><div class="stage-wrap">'+(pos?'<div class="walking-avatar">'+avatarSVG(58)+'</div>':'')+'<button class="stage '+(complete?"complete":locked?"locked":"current")+'" '+(locked?"disabled title=\"Finish the previous stage to unlock\"":"onclick=\"start("+i+")\"")+' aria-label="'+esc(lessons[i].title)+'" title="'+esc(lessons[i].title)+'">'+(complete?"✓":locked?"🔒":icon)+'</button><div class="stage-caption"><strong>'+esc(lessons[i].title)+'</strong><small>'+(complete?"Completed · Replay":locked?"Locked":"START HERE · +40 XP")+'</small></div></div></div>'}
function renderWorldMap(){let next=currentLevel();app.innerHTML='<div class="journey-top"><div class="journey-profile">'+avatarSVG(66)+'<div><div class="eyebrow">YOUR EXPLORER</div><strong>'+esc(state.avatar.name)+'</strong><div class="muted">Level '+(Math.floor(state.xp/200)+1)+' · '+state.xp+' XP</div></div></div><button class="btn secondary" onclick="go(\'Profile\')">Customize ✨</button></div><div class="stats"><span class="pill">🔥 '+state.streak+' day streak</span><span class="pill">🏅 '+state.done.length+'/30 stages</span><span class="pill">🌟 '+Math.floor(state.xp/200+1)+'</span></div><section class="quest-banner"><div class="eyebrow">NEXT QUEST</div><h2>'+(next===lessons.length?"You've conquered all six worlds!":"Stage "+(next+1)+": "+esc(lessons[next].title))+'</h2><p>'+(next===lessons.length?"Replay your favourite stages or practice charts.":"Complete challenges to unlock the next stage. Each world has five stages.")+'</p>'+button(next===lessons.length?"Replay first stage":"Play next stage →","start("+(next===lessons.length?0:next)+")")+'</section><div class="map-hint">🗺️ Follow the winding path. Finish a stage to unlock the next!</div>'+topics.map((_,w)=>worldCard(w)+'<div class="game-path">'+Array.from({length:5},(_,j)=>pathNode(w*5+j)).join("")+'</div>').join("")+'<section class="card"><h3>🎮 Side quests</h3><p>Practice chart reading and risk calculations whenever you want.</p>'+button("Enter the arcade","go(\'Play\')","secondary")+'</section>'}

/* Gentle, on-demand learning support. Hints never reveal the answer directly. */
let helpOpen=false,helpUsed=0,helpLesson=null,helpWrong=[];
function topicHelp(l,q){
 const id=(q.sources||l.sourceIds)[0];
 return [...(q.hints||['Consider your goal and constraints.',l.explain]),CandleCurriculum.sources[id].url];
}

function helpCard(l,q){const [first,second]=topicHelp(l,q);return '<div class="help-card" role="note"><strong>💡 A little nudge</strong><p>'+esc(first)+'</p>'+(helpUsed>1?'<p>'+esc(second)+'</p>':'<button class="help-more" onclick="showMoreHelp()">Need another hint →</button>')+'</div>'}
function showHelp(){if(lesson===null)return;helpOpen=true;helpUsed=Math.max(helpUsed,1);render()}
function showMoreHelp(){helpOpen=true;helpUsed=2;render()}
function helpReset(){helpOpen=false;helpUsed=0}
const baseLessonRender=renderLesson;
renderLesson=function(){
 if(lesson===null)return;
 if(helpLesson!==lesson){helpLesson=lesson;helpReset();helpWrong=[]}
 baseLessonRender();
 const l=lessons[lesson],q=l.qs[question],section=app.querySelector("section.card");
 if(!section)return;
 const slot=document.createElement("div");slot.className="help-slot";
 slot.innerHTML=helpOpen?helpCard(l,q):'<button class="help-trigger" onclick="showHelp()">💡 Stuck? Get a hint <span>Free • No XP penalty</span></button>';
 const prompt=section.querySelector("h3");if(prompt)prompt.insertAdjacentElement("afterend",slot);else section.appendChild(slot);
};
const baseStart=start;
start=function(i){helpLesson=null;helpReset();helpWrong=[];baseStart(i)};
const baseCheck=check;
check=function(){
 if(lesson===null)return baseCheck();
 const l=lessons[lesson],q=l.qs[question],wasChecked=checked;
 let right=false;
 if(!wasChecked){
 right=selected!==null&&selected===q.correct;
 }
 baseCheck();
 if(!wasChecked&&checked&&!right)helpWrong.push({q:q.q,explain:q.explain||l.explain,topic:l.title});
};
function practiceAgain(){const id=helpLesson;helpReset();helpWrong=[];if(id!==null)start(id)}
function studyVideoLink(l){return topicHelp(l,{q:l.title})[2]}
function finishSupport(id,missed){
 const l=lessons[id],url=studyVideoLink(l),card=app.querySelector("section.card");if(!card)return;
 const extra=document.createElement("div");extra.className="finish-support";
 extra.innerHTML='<h3>'+(missed>0?"Keep going — progress takes practice.":"Want to make it stick?")+'</h3><p>'+(missed>0?"You missed "+missed+" question"+(missed===1?"":"s")+". You can review the explanations and retry without losing XP.":"Replaying helps reinforce what you learned.")+'</p>'+(helpWrong.length?'<details><summary>Review questions you missed</summary>'+helpWrong.map(x=>'<div class="missed-item"><strong>'+esc(x.q)+'</strong><p>'+esc(x.explain)+'</p></div>').join("")+'</details>':"")+'<div class="support-actions"><button class="btn secondary" onclick="practiceAgain()">🔁 Practice this lesson</button><a class="btn support-link" href="'+url+'" target="_blank" rel="noopener noreferrer">Read the source material ↗</a></div><small class="muted">Opens the source that informs this lesson.</small>';
 card.appendChild(extra)
}
const baseAdvance=advance;
advance=function(){
 if(lesson===null)return baseAdvance();
 const id=lesson,final=question===lessons[id].qs.length-1,missed=mistakes;
 baseAdvance();
 if(final&&lesson===null)finishSupport(id,missed);
 else if(lesson!==null)helpReset();
};


/* Energy system: 15 maximum, 1 restored every 30 minutes, one energy per lesson start.
   Browser-local progression; server enforcement requires backend support. */
const ENERGY_MAX=15,ENERGY_MS=30*60*1000;
state.energy ??= ENERGY_MAX;
state.energyAt ??= Date.now();
function refillEnergy(){
 const now=Date.now();
 if(!Number.isFinite(state.energy)||state.energy<0||state.energy>ENERGY_MAX)state.energy=ENERGY_MAX;
 if(!Number.isFinite(state.energyAt)||state.energyAt>now)state.energyAt=now;
 if(state.energy>=ENERGY_MAX){state.energyAt=now;return}
 const earned=Math.floor((now-state.energyAt)/ENERGY_MS);
 if(earned>0){state.energy=Math.min(ENERGY_MAX,state.energy+earned);state.energyAt=state.energy===ENERGY_MAX?now:state.energyAt+earned*ENERGY_MS;save()}
}
function energyCountdown(){
 refillEnergy();
 if(state.energy>=ENERGY_MAX)return "Full";
 const seconds=Math.max(0,Math.ceil((ENERGY_MS-(Date.now()-state.energyAt))/1000));
 return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}
function updateEnergyUI(){
 refillEnergy();
 const el=document.getElementById("energyTop");
 if(!el)return;
 el.textContent="⚡ "+state.energy+"/"+ENERGY_MAX;
 el.title=state.energy===ENERGY_MAX?"Energy full": "Next energy in "+energyCountdown();
 el.setAttribute("aria-label",state.energy+" of "+ENERGY_MAX+" energy. "+(state.energy===ENERGY_MAX?"Full":"Next in "+energyCountdown()));
 el.classList.toggle("energy-empty",state.energy===0);
 const countdown=document.getElementById("energyCountdown");
 if(countdown)countdown.textContent=state.energy===ENERGY_MAX?"All charged!":"Next energy in "+energyCountdown();
}
function showEnergyInfo(){
 refillEnergy();
 const old=document.getElementById("energyOverlay");if(old)old.remove();
 const overlay=document.createElement("div");overlay.id="energyOverlay";overlay.className="energy-overlay";
 overlay.innerHTML='<div class="energy-dialog" role="dialog" aria-modal="true" aria-labelledby="energyTitle"><button class="energy-close" onclick="document.getElementById(\'energyOverlay\').remove()" aria-label="Close">✕</button><div class="energy-hero">⚡</div><h2 id="energyTitle">Your learning energy</h2><div class="energy-amount">'+state.energy+' <span>/ '+ENERGY_MAX+'</span></div><div class="energy-track"><div style="width:'+(state.energy/ENERGY_MAX*100)+'%"></div></div><p>Starting a lesson uses <strong>1 energy</strong>. You regain <strong>1 energy every 30 minutes</strong>, up to 15.</p><p class="energy-time" id="energyCountdown">'+(state.energy===ENERGY_MAX?"All charged!":"Next energy in "+energyCountdown())+'</p><p class="muted">You can still use the arcade and review learning resources while you recharge.</p><button class="btn" onclick="document.getElementById(\'energyOverlay\').remove()">Got it</button></div>';
 overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove()});
 document.body.appendChild(overlay);
}
const energyStartBase=start;
start=function(i){
 if(!Number.isInteger(i)||i<0||i>=lessons.length)return;
 refillEnergy();
 if(state.energy<1){
  showEnergyInfo();return;
 }
 // Check locked career stages before spending energy.
 if(i>=newLessonStart){const ids=careerLessonIndices(lessons[i].career),next=ids.findIndex(id=>!state.done.includes(id));if(next>=0&&ids.indexOf(i)>next){alert("Finish the previous stage first!");return}}
 const before=lesson;
 energyStartBase(i);
 if(lesson===i&&before!==i){state.energy--;if(state.energy===ENERGY_MAX-1)state.energyAt=Date.now();save();updateEnergyUI()}
};
const energyHeaderBase=updateHeader;
updateHeader=function(){energyHeaderBase();updateEnergyUI()};
setInterval(updateEnergyUI,1000*15);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)updateEnergyUI()});

 const rank=rankInfo(),path=careerPaths.find(p=>p.id===state.path)||careerPaths[0],ids=careerLessonIndices(path.id),next=currentCareerLevel(),done=ids.filter(i=>state.done.includes(i)).length,all=state.done.length,total=lessons.length,progress=Math.round(all/total*100),finished=done===ids.length;
 const nextRank=Math.max(0,rank.next-rank.score),rankProgress=Math.min(100,Math.round(rank.score%850/850*100));

 app.innerHTML='<div class="dash"><div class="dash-welcome"><div><div class="eyebrow">YOUR LEARNING HQ</div><h2>Hey, '+esc(state.avatar.name)+' <span class="dash-wave">✦</span></h2><p>Small steps today. Smarter money moves tomorrow.</p></div><div class="dash-avatar">'+avatarSVG(78)+'</div></div><div class="dash-metrics"><div class="dash-metric"><span>🔥</span><strong>'+state.streak+'</strong><small>Day streak</small></div><div class="dash-metric"><span>✦</span><strong>'+state.xp+'</strong><small>Total XP</small></div><div class="dash-metric"><span>✓</span><strong>'+all+'</strong><small>Lessons done</small></div></div><section class="dash-feature"><div class="dash-feature-label"><span>✦ PICK UP WHERE YOU LEFT OFF</span><span>'+path.emoji+' '+esc(path.name)+'</span></div><div class="dash-feature-body"><div class="dash-feature-copy"><div class="dash-feature-tag">'+(finished?'PATH COMPLETE':'UP NEXT · LESSON '+Math.min(done+1,ids.length))+'</div><h2>'+esc(finished?'You did it!':lessons[next].title)+'</h2><p>'+(finished?'Explore another learning path or revisit your favourite challenges.':'Ready for your next challenge? You have everything you need to keep building momentum.')+'</p><div class="dash-feature-progress"><div class="dash-mini-track"><span style="width:'+(done/ids.length*100)+'%"></span></div><small>'+done+' / '+ids.length+' stages</small></div></div><div class="dash-feature-art">'+path.emoji+'</div></div><button class="dash-primary" onclick="start('+next+')">'+(finished?'Replay this path':'Continue learning')+' <span>→</span></button></section><div class="dash-section-heading"><div><div class="eyebrow">YOUR PROGRESS</div><h3>Growing every day</h3></div><button onclick="go(\'Learn\')">View journey →</button></div><div class="dash-progress-grid"><div class="dash-progress-card"><div class="dash-progress-icon">🏅</div><div class="eyebrow">CURRENT RANK</div><strong>'+esc(rank.name)+'</strong><div class="dash-mini-track"><span style="width:'+rankProgress+'%"></span></div><small>'+(rank.index===levelNames.length-1?'Highest rank unlocked':nextRank+' points to next rank')+'</small></div><div class="dash-progress-card"><div class="dash-progress-icon">📈</div><div class="eyebrow">OVERALL PROGRESS</div><strong>'+progress+'% complete</strong><div class="dash-mini-track"><span style="width:'+progress+'%"></span></div><small>'+all+' of '+total+' lessons</small></div></div><div class="dash-section-heading"><div><div class="eyebrow">EXPLORE</div><h3>Your learning tracks</h3></div><button onclick="go(\'Learn\')">All lessons →</button></div><div class="dash-paths">'+recommendations+'</div><section class="dash-bottom"><div><strong>🎮 Need a quick brain break?</strong><p>Practice trading math and chart skills in the arcade.</p></div><button class="btn secondary" onclick="go(\'Play\')">Play arcade →</button></section></div>';
}
function pickDashboardPath(id){state.path=id;save();lesson=null;tab="Learn";render()}
renderHome=function(){renderDashboard()};
renderLearn=function(){careerMap()};

choosePath=function(id){dashChoosePath(id);if(careerPaths.some(p=>p.id===id)){tab="Learn";render()}};
